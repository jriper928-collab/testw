html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}

.bat{position:fixed;font-size:26px;pointer-events:none;animation:fly 14s linear infinite;opacity:.7}

.bat:nth-of-type(3){top:55%;animation-duration:24s;animation-delay:-12s}
@keyframes fly{0%{left:-8%;transform:translateY(0)}50%{transform:translateY(-40px)}100%{left:108%;transform:translateY(10px)}}
.fog{position:fixed;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,rgba(139,61,255,.18));pointer-events:none}
main{position:relative;max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:Creepster,Georgia,serif;font-weight:400;color:var(--or);text-align:center;font-size:clamp(28px,7vw,44px);margin:8px 0 2px;text-shadow:0 0 18px rgba(255,122,26,.5);letter-spacing:1px}

.bar{height:8px;background:#2b1a3d;border-radius:8px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#ffc23d);transition:width .3s}
.dots{display:flex;gap:5px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.dots button{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#24153a;color:var(--mute);font-size:12px;cursor:pointer;padding:0}
.dots button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dots button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.dots button.cur{outline:2px solid var(--or);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,122,26,.08)}
.q{font-size:clamp(17px,4.4vw,21px);line-height:1.4;margin:0 0 16px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#26163a;color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.4;cursor:pointer;font-family:inherit;transition:transform .12s,border-color .12s}
.opt b{flex:0 0 26px;height:26px;border-radius:50%;background:#3a2358;display:grid;place-items:center;font-size:13px;color:var(--or)}
.opt:hover:not(:disabled){border-color:var(--or);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{margin-top:6px;border:1.5px dashed var(--or);border-radius:12px;padding:10px 14px;background:rgba(255,122,26,.07);cursor:pointer;font-size:14px;color:#ffd2a8;user-select:none}
.hint .a{display:none;margin-top:8px;color:var(--tx);line-height:1.45}
.hint.open .a{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--or);color:#1a0a00}
.btn.ghost{background:#2b1a3d;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.mute{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:14px}
.score{text-align:center}
.score .big{font-family:Creepster,Georgia,serif;font-size:64px;color:var(--or);text-shadow:0 0 20px rgba(255,122,26,.5)}
.mist{border:1px solid var(--line);border-left:4px solid var(--bad);background:#22122f;border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.45}

.mist .w{color:var(--bad)}.mist .r{color:var(--ok)}
.perfect{color:var(--ok);text-align:center;margin:16px 0}
</style>
</head>

const L="ABCD";let order,ans,cur,hints,AC,muted=false;
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function tone(f,t,d,type,v){if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}
function good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.18))}
function bad(){tone(200,0,.4,"sawtooth",.16);tone(140,.12,.5,"sawtooth",.16);tone(80,.3,.7,"square",.12);tone(300,.05,.3,"sawtooth",.05)}
function start(){order=Q.map(()=>shuf([0,1,2,3]));ans=Array(Q.length).fill(null);hints=Array(Q.length).fill(false);cur=0;render()}
function render(){
const q=Q[cur],a=ans[cur],n=Q.length,done=ans.filter(x=>x!==null).length;
const dots=Q.map((_,i)=>`<button data-go="${i}" class="${ans[i]===null?"":ans[i]===0?"ok":"no"} ${i===cur?"cur":""}">${i+1}</button>`).join("");
const opts=order[cur].map((oi,p)=>{let c="";if(a!==null){if(oi===0)c="ok";else if(oi===a)c="no"}
return `<button class="opt ${c}" data-p="${p}" ${a!==null?"disabled":""}><b>${L[p]}</b><span>${q[oi+1]}</span></button>`}).join("");
app.innerHTML=`<div class="top"><span>Sual ${cur+1} / ${n} · Cavablanıb: ${done}</span><button class="mute" id="mu">${muted?"🔇 Səssiz":"🔊 Səs"}</button></div>
<div class="bar"><i style="width:${done/n*100}%"></i></div><div class="dots">${dots}</div>
<div class="card"><p class="q">${q[0]}</p>${opts}
<div class="hint ${hints[cur]?"open":""}" id="hint">💡 İpucu – cavabı görmək üçün toxun<div class="a"><b>Cavab:</b> ${q[5]||q[1]}</div></div></div>
<div class="nav"><button class="btn ghost" id="prev" ${cur===0?"disabled":""}>← Əvvəlki</button>
${cur===n-1?`<button class="btn" id="fin">👻 Nəticəni göstər</button>`:`<button class="btn" id="next">Növbəti →</button>`}</div>`;
const d=document.querySelector(".dots .cur");d&&d.scrollIntoView({inline:"center",block:"nearest"});
}
app.addEventListener("click",e=>{
const t=e.target.closest("button,.hint");if(!t)return;
if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
if(AC&&AC.state==="suspended")AC.resume();
if(t.id==="hint"){hints[cur]=!hints[cur];t.classList.toggle("open",hints[cur]);return}
if(t.dataset.p!==undefined&&ans[cur]===null){ans[cur]=order[cur][+t.dataset.p];ans[cur]===0?good():bad();render();return}
if(t.dataset.go!==undefined){cur=+t.dataset.go;render();return}
if(t.id==="mu"){muted=!muted;render();return}
if(t.id==="prev"){cur--;render();return}
if(t.id==="next"){cur++;render();return}
if(t.id==="fin"){result();return}
if(t.id==="again"){start();scrollTo(0,0);return}
if(t.dataset.rev!==undefined){cur=+t.dataset.rev;render();scrollTo(0,0)}
});
function result(){
const n=Q.length,ok=ans.filter(x=>x===0).length,skip=ans.filter(x=>x===null).length;
const wrong=[];ans.forEach((a,i)=>{if(a!==0)wrong.push(i)});
const pct=Math.round(ok/n*100);
const msg=pct>=90?"🎃 Əla! Cadugər səndən qorxur!":pct>=70?"🦇 Yaxşıdır, bir az da çalış!":pct>=50?"👻 Orta nəticə – kabuslar səni gözləyir...":"💀 Daha çox təkrar et!";
const list=wrong.map(i=>{const a=ans[i];return `<div class="mist"><div class="t">${i+1}. ${Q[i][0]}</div>
<div class="w">✗ Sənin cavabın: ${a===null?"<i>cavab verilməyib</i>":Q[i][a+1]}</div><div class="r">✓ Düzgün cavab: ${Q[i][1]}</div>
<button class="btn ghost" style="margin-top:8px;padding:6px 12px;font-size:13px" data-rev="${i}">Suala get</button></div>`}).join("");
app.innerHTML=`<div class="card score"><div class="big">${ok} / ${n}</div><div style="font-size:18px">${pct}% · ${msg}</div>
<div class="sub" style="margin-top:8px">Düzgün: ${ok} · Səhv: ${n-ok-skip} · Cavabsız: ${skip}</div></div>
<h2 style="color:var(--or);margin:20px 0 4px">${wrong.length?"Səhvlərin ("+wrong.length+")":""}</h2>
${wrong.length?list:`<div class="perfect">🎉 Heç bir səhv yoxdur! Mükəmməl!</div>`}
<div class="nav" style="justify-content:center"><button class="btn" id="again">🔄 Yenidən başla</button></div>`;
scrollTo(0,0);
}
start();
</script>
