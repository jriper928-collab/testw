<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>İnformasiya Təhlükəsizliyi Testi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centered column, quiz card on top, question map below. Light theme only, by request. */
:root{
  --bg:#f5f8fc; --card:#ffffff; --ink:#14233b; --muted:#5d6e87; --line:#dbe4f0;
  --accent:#2457d6; --accent-soft:#e8effd;
  --good:#16885a; --good-soft:#e5f6ee; --bad:#cf3b34; --bad-soft:#fdeceb;
  --hint:#fff7e0; --hint-line:#f0d98a; --hint-ink:#6b5200;
  --font-head:"Space Grotesk","Segoe UI",Arial,sans-serif;
  --font-body:"Inter","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-head);font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500;color:var(--muted)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(20,35,59,.05),0 8px 24px rgba(20,35,59,.05)}
.qno{font-family:var(--font-head);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.q{font-family:var(--font-head);font-size:1.3rem;line-height:1.35;font-weight:600;margin:6px 0 18px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:28px;height:28px;border-radius:7px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-weight:600;font-size:.85rem;color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.verdict{margin-top:14px;font-weight:600;min-height:1.5em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.hintbox{margin-top:16px}
.hintbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--hint-line);background:var(--hint);color:var(--hint-ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem}
.hintbtn:hover{filter:brightness(.97)}
.hinttext{margin-top:10px;background:var(--hint);border:1px solid var(--hint-line);color:var(--hint-ink);border-radius:10px;padding:12px 14px;font-size:.93rem}
.hinttext b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#1c46b3;color:#fff}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.map button.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.map button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.map button.cur{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.maplabel{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.finish{display:flex;justify-content:flex-end}
/* results */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem}
.stat.g{background:var(--good-soft);color:var(--good)} .stat.r{background:var(--bad-soft);color:var(--bad)} .stat.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
h2{font-family:var(--font-head);font-size:1.15rem;margin:0 0 4px}
.mist{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.m{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.m .mq{font-weight:600;margin:2px 0 10px;overflow-wrap:anywhere}
.m .row{display:flex;gap:10px;font-size:.92rem;margin-top:6px;overflow-wrap:anywhere}
.m .tag{flex:none;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:6px;height:fit-content;margin-top:2px}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)} .tag.none{background:var(--bg);color:var(--muted)}
.perfect{padding:16px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:600;margin-top:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (max-width:480px){.card{padding:16px}.q{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>İnformasiya Təhlükəsizliyi</h1>
      <div class="sub">Variantlı test · 39 sual</div>
    </div>
    <div class="tools">
      <span class="chip">Düzgün: <b id="cGood">0</b></span>
      <span class="chip">Səhv: <b id="cBad">0</b></span>
      <button class="chip" id="muteBtn" type="button" aria-pressed="false">Səs: açıq</button>
    </div>
  </header>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <section id="quiz" class="wrap" style="gap:18px">
    <div class="card">
      <div class="qno" id="qno"></div>
      <h2 class="q" id="qtext"></h2>
      <ul class="opts" id="opts"></ul>
      <div class="verdict" id="verdict" aria-live="polite"></div>
      <div class="hintbox">
        <button class="hintbtn" id="hintBtn" type="button" aria-expanded="false">💡 İpucu</button>
        <div class="hinttext" id="hintText" hidden></div>
      </div>
      <div class="nav">
        <button class="btn" id="prev" type="button">← Əvvəlki</button>
        <button class="btn pri" id="next" type="button">Növbəti →</button>
      </div>
    </div>
    <div>
      <div class="maplabel">Suallar arasında keçid</div>
      <div class="map" id="map"></div>
    </div>
    <div class="finish"><button class="btn pri" id="finish" type="button">Testi bitir və nəticəyə bax</button></div>
  </section>

  <section id="result" hidden>
    <div class="card">
      <div class="score">
        <div class="ring" id="ring"><span id="pct"></span></div>
        <div>
          <h2 id="verd"></h2>
          <div class="stats" id="stats"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn pri" id="again" type="button">Yenidən başla</button>
        <button class="btn" id="retry" type="button">Yalnız səhvləri təkrar et</button>
        <button class="btn" id="back" type="button">Suallara qayıt</button>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h2>Səhvlər və cavabsız suallar</h2>
      <div class="sub">Suallar test ardıcıllığı ilə verilib.</div>
      <div id="mist"></div>
    </div>
  </section>
</div>

var LETTERS = ["A","B","C","D"];
var $ = function(id){return document.getElementById(id)};
var items = [];   // active questions: {q,c,h,opts:[{t,ok}], pick:null|index}
var cur = 0, muted = false, ac = null;

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function build(src){
  items = src.map(function(d){
    var opts = shuffle([{t:d.h,ok:true}].concat(d.w.map(function(x){return {t:x,ok:false}})));
    return {q:d.q,c:d.h,h:d.h,opts:opts,pick:null,hint:false,src:d};
  });
  cur = 0;
  $("map").innerHTML = "";
  items.forEach(function(_,i){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = i+1; b.setAttribute("aria-label","Sual "+(i+1));
    b.onclick = function(){ go(i); };
    $("map").appendChild(b);
  });
  $("quiz").hidden = false; $("result").hidden = true;
  document.querySelector(".sub").textContent = "Variantlı test · " + items.length + " sual";
  render();
}

/* ---------- sounds ---------- */
function ctx(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac = null; } }
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone(freq, start, dur, type, vol){
  var a = ctx(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime+start);
  g.gain.setValueAtTime(0.0001, a.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol, a.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+start+dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime+start); o.stop(a.currentTime+start+dur+0.05);
}
function soundGood(){ if(muted) return; tone(660,0,0.16,"sine",0.25); tone(880,0.12,0.16,"sine",0.25); tone(1320,0.24,0.28,"sine",0.22); }
function soundBad(){ if(muted) return; tone(220,0,0.22,"sawtooth",0.18); tone(150,0.18,0.38,"sawtooth",0.18); }

/* ---------- render ---------- */
function stats(){
  var g=0,b=0; items.forEach(function(it){ if(it.pick!==null){ if(it.opts[it.pick].ok) g++; else b++; } });
  return {g:g,b:b,n:items.length-g-b};
}
function render(){
  var it = items[cur];
  $("qno").textContent = "Sual " + (cur+1) + " / " + items.length;
  $("qtext").textContent = it.q;
  var ul = $("opts"); ul.innerHTML = "";
  it.opts.forEach(function(o,i){
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    var l = document.createElement("span"); l.className = "l"; l.textContent = LETTERS[i];
    var t = document.createElement("span"); t.className = "t"; t.textContent = o.t;
    b.appendChild(l); b.appendChild(t);
    if(it.pick !== null){
      b.disabled = true;
      if(o.ok) b.classList.add("right");
      else if(i === it.pick) b.classList.add("wrong");
      else b.classList.add("dim");
    }
    b.onclick = function(){ choose(i); };
    li.appendChild(b); ul.appendChild(li);
  });
  var v = $("verdict");
  if(it.pick === null){ v.textContent = ""; v.className = "verdict"; }
  else if(it.opts[it.pick].ok){ v.textContent = "Düzgündür!"; v.className = "verdict ok"; }
  else { v.textContent = "Səhvdir. Düzgün cavab yaşıl rənglə göstərilib."; v.className = "verdict no"; }
  $("hintText").hidden = !it.hint;
  $("hintText").innerHTML = "<b>Sənəddəki cavab</b>";
  var p = document.createElement("span"); p.textContent = it.h; $("hintText").appendChild(p);
  $("hintBtn").setAttribute("aria-expanded", String(it.hint));
  $("hintBtn").textContent = it.hint ? "💡 İpucunu gizlət" : "💡 İpucu";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === items.length-1;
  var s = stats();
  $("cGood").textContent = s.g; $("cBad").textContent = s.b;
  $("bar").style.width = ((s.g+s.b)/items.length*100) + "%";
  var btns = $("map").children;
  for(var i=0;i<btns.length;i++){
    var x = items[i], c = "";
    if(x.pick !== null) c = x.opts[x.pick].ok ? "good" : "bad";
    if(i === cur) c += " cur";
    btns[i].className = c;
  }
}
function choose(i){
  var it = items[cur];
  if(it.pick !== null) return;
  it.pick = i;
  if(it.opts[i].ok) soundGood(); else soundBad();
  render();
}
function go(i){ if(i<0||i>=items.length) return; cur = i; render(); }

$("prev").onclick = function(){ go(cur-1); };
$("next").onclick = function(){ go(cur+1); };
$("hintBtn").onclick = function(){ items[cur].hint = !items[cur].hint; render(); };
$("muteBtn").onclick = function(){
  muted = !muted;
  this.textContent = "Səs: " + (muted ? "bağlı" : "açıq");
  this.setAttribute("aria-pressed", String(muted));
  if(!muted) tone(660,0,0.12,"sine",0.15);
};
document.addEventListener("keydown", function(e){
  if($("quiz").hidden) return;
  if(e.key === "ArrowRight") go(cur+1);
  else if(e.key === "ArrowLeft") go(cur-1);
  else {
    var k = e.key.toUpperCase(), idx = LETTERS.indexOf(k);
    if(idx < 0 && "1234".indexOf(e.key) >= 0) idx = +e.key - 1;
    if(idx >= 0 && idx < 4) choose(idx);
  }
});

/* ---------- results ---------- */
$("finish").onclick = showResult;
function showResult(){
  var s = stats(), total = items.length;
  var pct = Math.round(s.g/total*100);
  var col = pct >= 80 ? "var(--good)" : pct >= 50 ? "var(--accent)" : "var(--bad)";
  $("ring").style.background = "conic-gradient(" + col + " " + pct + "%, var(--line) 0)";
  $("pct").textContent = pct + "%";
  $("verd").textContent = pct === 100 ? "Əla nəticə!" : pct >= 80 ? "Çox yaxşı nəticə" : pct >= 50 ? "Orta nəticə, təkrar etmək faydalıdır" : "Təkrar öyrənmək lazımdır";
  $("stats").innerHTML =
    '<span class="stat g">Düzgün: '+s.g+'</span><span class="stat r">Səhv: '+s.b+'</span><span class="stat n">Cavablanmayıb: '+s.n+'</span>';
  var box = $("mist"); box.innerHTML = "";
  var list = [];
  items.forEach(function(it,i){ if(it.pick === null || !it.opts[it.pick].ok) list.push(i); });
  $("retry").hidden = list.length === 0;
  if(list.length === 0){
    box.innerHTML = '<div class="perfect">Bütün suallara düzgün cavab verdiniz. Səhv yoxdur.</div>';
  } else {
    var wrap = document.createElement("div"); wrap.className = "mist";
    list.forEach(function(i){
      var it = items[i], m = document.createElement("div"); m.className = "m";
      var no = document.createElement("div"); no.className = "qno"; no.textContent = "Sual " + (i+1);
      var q = document.createElement("div"); q.className = "mq"; q.textContent = it.q;
      m.appendChild(no); m.appendChild(q);
      function row(cls, label, text){
        var r = document.createElement("div"); r.className = "row";
        var t = document.createElement("span"); t.className = "tag " + cls; t.textContent = label;
        var x = document.createElement("span"); x.textContent = text;
        r.appendChild(t); r.appendChild(x); m.appendChild(r);
      }
      if(it.pick === null) row("none","Cavabsız","Bu suala cavab verilməyib.");
      else row("bad","Sizin cavab", it.opts[it.pick].t);
      row("good","Düzgün cavab", it.c);
      wrap.appendChild(m);
    });
    box.appendChild(wrap);
  }
  $("quiz").hidden = true; $("result").hidden = false;
  window.scrollTo(0,0);
}
$("again").onclick = function(){ build(DATA); window.scrollTo(0,0); };
$("back").onclick = function(){ $("quiz").hidden = false; $("result").hidden = true; render(); window.scrollTo(0,0); };
$("retry").onclick = function(){
  var wrong = [];
  items.forEach(function(it){ if(it.pick === null || !it.opts[it.pick].ok) wrong.push(it.src); });
  build(wrong); window.scrollTo(0,0);
};

build(DATA);
</script>

</body></html>
