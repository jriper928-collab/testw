<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optik veriliş sistemləri — Test</title>
<style>
:root{color-scheme:light;--bg:#fff;--sf:#f5f7fb;--tx:#1b2330;--mu:#6b7585;--ac:#2f6fed;--ok:#1f9d55;--okb:#e6f6ec;--er:#d93a3a;--erb:#fdeaea;--bd:#dfe4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:14px;margin-bottom:12px}
.bar{height:6px;background:var(--sf);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:12px;cursor:pointer;color:var(--tx)}
.dots .cur{border-color:var(--ac);box-shadow:0 0 0 2px #2f6fed33}.dots .ok{background:var(--okb);border-color:var(--ok)}.dots .er{background:var(--erb);border-color:var(--er)}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 2px 10px #1b23300d}
.q{font-weight:650;font-size:18px;margin:0 0 14px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1.5px solid var(--bd);background:var(--sf);border-radius:10px;font:inherit;color:var(--tx);cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}.o:disabled{cursor:default}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.er{background:var(--erb);border-color:var(--er)}
.hint{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ac);border-radius:10px;background:#eef3ff;color:var(--ac);cursor:pointer;font-weight:600;width:100%;text-align:left;font:inherit}
.hint small{display:block;color:var(--tx);font-weight:400;margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.b{padding:10px 18px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.b.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.b:disabled{opacity:.4;cursor:default}
.big{font-size:44px;font-weight:700;color:var(--ac);margin:6px 0}
.r{border-left:4px solid var(--er);background:var(--erb);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.r b{display:block;margin-bottom:4px}.r .c{color:var(--ok)}.r .x{color:var(--er)}
.hide{display:none}
</style></head><body><div class="w">
<h1>Optik veriliş sistemləri — Kollokvium 2</h1>
<div class="sub" id="st"></div>
<div class="bar"><i id="pb"></i></div>
<div class="dots" id="dots"></div>
<div id="main"></div>
</div>
<script>
const D=[["Optik şüa mənbələrinə qoyulan əsas tələblərdən biri deyil?","Optik şüa mənbəyinə məxsus olmayan tələb — böyük ölçü və yüksək elektrik enerjisi sərfi. Əsas tələblər: kiçik ölçü, yüksək işıq gücü, uzun ömür, sabitlik, lif nüvəsinə asan cəmlənmədir.","Kiçik ölçü və aşağı enerji sərfi","Uzun ömür və sabitlik","Lif nüvəsinə asan cəmlənmə"],["İstiqamətli rabitə üzrə optik-lifli veriliş sistemləri neçə əsas qrupa bölünür?","2 əsas qrupa: 1) birlifli sistemlər; 2) çoxlifli sistemlər.","3 əsas qrupa: birlifli, ikilifli, çoxlifli sistemlər","2 əsas qrupa: analoq və rəqəmsal sistemlər","4 əsas qrupa"],["Optik şüa mənbələrinin yaradılmasında hansı elementlərdən istifadə olunur?","Yarımkeçirici optik şüa mənbələrindən: lazer diodları (LD) və işıq yayan diodlardan (LED).","Fotodiodlar (PD) və lavina diodları (APD)","Qaz lazerləri və közərmə lampaları","Tunel diodları və stabilitronlar"],["Spektral xarakteristika hansı asılılığı əks etdirir?","Spektral xarakteristika şüalanmanın spektral sıxlığının dalğa uzunluğundan asılılığını — S(λ) funksiyasını əks etdirir.","P = f(I) — işıq gücünün cərəyandan asılılığı","I = f(U) — cərəyanın gərginlikdən asılılığı","Şüalanma gücünün məkan bucaqları üzrə paylanması"],["İmpulsun artım müddəti hansı simvolla göstərilir?","tᵣ (t-r) simvolu ilə göstərilir.","λ₀ simvolu ilə","Iₕ simvolu ilə","η simvolu ilə"],["Hansı halda optik şüa ötürülərkən itki baş verir?","İşıq mənbəyinin çıxış diametri və ya açısı lifin daxili diametrinə/riyazi aperturasına uyğun gəlmədikdə, həmçinin qoşma yerlərdə və lifdə səpilmə-udma nəticəsində itki baş verir.","Yalnız lif əyildikdə","Mənbənin gücü artdıqda","Lifin uzunluğu azaldıqda"],["Elektrik siqnalını optik siqnala çevirən qurğu necə adlanır?","Elektrooptik modulyator (EOM).","Fotodetektor","Optik izolyator","Optik gücləndirici"],["Optik vericinin tərkibinə nə daxildir?","Mənbə (lazer/LED), modulyator, mənbənin sürücüsü (drayver), kodlayıcı və optik izolyatordur.","Fotodiod, gücləndirici və demodulyator","Mənbə, retranslyator və multipleksor","Yalnız lazer və lif"],["Siqnalın lif üzrə keçməsi zamanı sönməsini kompensasiya edən qurğu necə adlanır?","Optik gücləndirici (optik amplifier).","Optik izolyator","Elektrooptik modulyator","Demodulyator"],["Faydalı iş əmsalı düsturunda mərkəzdə dayanan P_dn nəyi ifadə edir?","Ən sadə halda P — optik çıxış gücünü (diodun şüalandırdığı işıq gücünü) ifadə edir; η = P_çıxış / P_elektrik giriş.","P — elektrik giriş gücünü ifadə edir; η = P_giriş / P_çıxış","P — lifdə itirilən gücü ifadə edir","P — fotodetektorun qəbul etdiyi gücü ifadə edir"],["Volt-amper xarakteristikası hansı asılılığı ifadə edir?","Diodun cərəyanının gərginlikdən asılılığını: I = f(U).","Işıq gücünün cərəyandan asılılığını: P = f(I)","Spektral sıxlığın dalğa uzunluğundan asılılığını","Şüalanmanın bucaq paylanmasını"],["İklifli bizoləqli birkəbəlli veriliş sistemlərinin əsas üstün cəhəti nədir?","Eyni anda iki istiqamətdə ötürmə imkanı və böyük ötürmə məsafəsi; hər lif bir istiqamətdə işlədiyi üçün ayrılma (azlarma) effekti yoxdur.","Sadə quruluş və aşağı qiymət","Lif ehtiyatının iki qat az olması","Yalnız qısa məsafələrdə ötürmə"],["Mənbənin çıxış diametri lifin daxili diametrindən böyük olduqda və uyğunluq olmadıqda nə baş verir?","Şuanın lif nüvəsinə tam daxil olmaması nəticəsində əlavə optik itkilər yaranır (gücün bir hissəsi lifə ötürülmür).","Şüa lifə tam daxil olur, itki olmur","Lifdə dispersiya sıfıra enir","Siqnal gücləndirilir"],["Optik şüa mənbəyinin əsas parametrlərinə hansı daxildir?","Çıxış işıq gücü, iş dalğa uzunluğu, spektral en, impuls artım vaxtı, faydalı iş əmsalı və iş ömrü.","Lifin uzunluğu və sönmə əmsalı","Fotodetektorun həssaslığı","Retranslyatorların sayı"],["Qəbuledici optik modul (QOM) nələrin birləşməsindən ibarətdir?","Fotodetektordan (fotodiod), qəbuledici gücləndiricidən və demodulyatordan ibarətdir.","Lazerdən, modulyatordan və drayverdən ibarətdir","Multipleksordan və interfeys elementindən ibarətdir","Optik izolyatordan və gücləndiricidən ibarətdir"],["İklifli bizoləqli birkəbəlli veriliş sistemlərinin əsas çatışmaz cəhəti nədir?","Mürəkkəb quruluş, yüksək qiymət və lif xəttinin səmərəsiz istifadəsi.","Sadə quruluş və aşağı qiymət","Kiçik zolaq eni","Yüksək sürət"],["İstiqamət diaqramı şüalanmanın hansı xarakteristikasını əks etdirir?","Şüalanma gücünün məkan bucaqları üzrə paylanmasını — şüanın istiqamətlənmə dərəcəsini əks etdirir.","Şüalanma gücünün cərəyandan asılılığını","Spektral sıxlığı","Cərəyanın gərginlikdən asılılığını"],["Sərbəst yayılma mühitində dalğa uzunluğu hansı simvolla işarə olunur?","λ₀ (lambda-sıfır) simvolu ilə.","n simvolu ilə","C₀ simvolu ilə","f simvolu ilə"],["Birlifli izoləqli sistemlərdə verici istiqamətlərinin ayrılması hansı köməyi ilə həyata keçirilir?","Optik izolyator və fərqli dalğa uzunluqları (WDM) köməyi ilə.","Yalnız optik gücləndirici ilə","Multipleksor və kodlayıcı ilə","Fotodiod və demodulyator ilə"],["Optik şüalanma dalğasının uzunluğu düsturunun (λ = C₀/(n·f)) mərkəzdəki hasili nəyi ifadə edir?","n·f hasili — işığın tezliyi dalğa uzunluğunun lif sıxma göstəricisinə bölünməsi nəzərə alınmaqla lifdə yayılma sürətini ifadə edir (v = C₀/n).","Lifdə sönmə əmsalını ifadə edir","İmpuls artım müddətini ifadə edir","Faydalı iş əmsalını ifadə edir"],["Optik retranslyatorlar hansı üsullarla siqnalların emalını həyata keçirirlər?","1) Elektrik (OEO) üsulu — qəbul, gücləndirmə və yenidən ötürmə; 2) Optik üsul — birbaşa optik gücləndirmə (3R: bərpa, formalaşdırma, vaxt düzəlişi).","Yalnız elektrik üsulu ilə","Yalnız modulyasiya ilə","Multipleksləşdirmə və demultipleksləşdirmə ilə"],["Sərbəst yayılma mühitində dalğa uzunluğunun (λ₀) sıxma göstəricisinə (n) nisbəti nə verir?","Lifdəki (mühitdəki) real dalğa uzunluğunu: λ = λ₀ / n.","λ = λ₀ · n","Lifdə yayılma sürətini: v = λ₀ / n","Tezliyi: f = λ₀ / n"],["Optik-lifli veriliş sistemlərinin üstünlükləri arasında hansı göstərilməmişdir?","Üstünlüklərə aid olmayan göstərici — yüksək qiymət (bu sistemlərin çatışmazlığıdır). Üstünlüklər: böyük zolaq eni, az itki, yüksək sürət, kifayət qədər immunitet.","Yüksək qiymət deyil, böyük zolaq eni","Az itki","Yüksək sürət"],["Optik şüa mənbələrindən tələb olunan əsas şərtlərdən biri hansıdır?","Mənbənin şüalanması lifin minimal sönmə (minimal dispersiya) olan dalğa uzunluğuna uyğun olmalıdır.","Mənbənin şüalanması geniş spektrli olmalıdır","Mənbənin ölçüsü lifdən böyük olmalıdır","Mənbə yüksək enerji sərf etməlidir"],["İşıq sürətinin (C) vakuumdakı sürətdən (C₀) və sıxma göstəricisindən (n) asılılıq düsturu necədir?","C = C₀ / n.","C = C₀ · n","C = n / C₀","C = C₀ + n"],["Optik şüa mənbəyinin faydalı iş əmsalının düsturu hansıdır?","η = P_optik çıxış / P_elektrik giriş.","η = P_elektrik giriş / P_optik çıxış","η = I / U","η = λ₀ / n"],["Qəbul traktının çıxışındakı uzlaşma avadanlığı hansı funksiyanı yerinə yetirir?","Demodulyator funksiyasını — informasiyanı daşıyıcıdan ayırıb ilkin siqnal formasına qaytarır.","Modulyator funksiyasını — siqnalı daşıyıcıya yükləyir","Multipleksor funksiyasını","İzolyator funksiyasını"],["Aşağıdakılardan hansı optik şüa mənbəyinin parametrlərinə daxil deyil?","Mənbə parametrlərinə daxil deyil: lifin uzunluğu (veriliş xəttinin parametri). Mənbə parametrlərinə — işıq gücü, dalğa uzunluğu, artım vaxtı, ömür aiddir.","Mənbə parametrlərinə daxil deyil: işıq gücü","Mənbə parametrlərinə daxil deyil: dalğa uzunluğu","Mənbə parametrlərinə daxil deyil: artım vaxtı"],["Həyəcanlanma cərəyanı hansı simvolla qeyd olunur?","Iₕ (I_h) simvolu ilə qeyd olunur.","Uₕ (U_h) simvolu ilə","Pₕ (P_h) simvolu ilə","ηₕ (η_h) simvolu ilə"],["Optik şüa mənbəyinin xarakteristikalarına hansı aiddir?","İşıq gücünün cərəyandan asılılığı P = f(I), VAX, istiqamət və spektral xarakteristikalar.","Lifin uzunluğu və sönməsi","Retranslyator intervalı","Fotodetektorun həssaslığı"],["Optik kabellərin istehsalı ilə əlaqədar hansı tendensiya qeyd olunur?","Liflərin sayının artırılması və onların diametrinin kiçildilməsi tendensiyası.","Liflərin sayının azaldılması və diametrin böyüdülməsi","Yalnız lif diametrinin artırılması","Liflərin mis ilə əvəz olunması"],["Hansı veriliş sürətinə malik sistemlər daha geniş tətbiq olunur?","Yüksək sürətli (Gbit/s səviyyəsində) birlifli veriliş sistemləri.","Aşağı sürətli (kbit/s) çoxlifli sistemlər","Yalnız analoq sistemlər","Qısa məsafəli mis sistemlər"],["Eyni dalğa uzunluğu ilə hər iki istiqamətdə siqnalların verilişi üçün vahid optik lifdən istifadə olunan sistem hansıdır?","İkiistiqamətli (bidirectional) birlifli veriliş sistemi.","Biristiqamətli birlifli veriliş sistemi","İkilifli bizoləqli sistem","Çoxlifli sistem"],["İklifli bizoləqli birkəbəlli veriliş sistemlərində hər bir optik lif nəyə ekvivalentdir?","Müstəqil bir veriliş kanalına ekvivalentdir.","Bir multipleksora ekvivalentdir","Bir retranslyatora ekvivalentdir","Bir fotodetektora ekvivalentdir"],["Modulyasiya tezliyi hansı hərf və hansı vahidlə ifadə olunur?","f hərfi ilə, hers (Hz) vahidi ilə ifadə olunur.","λ hərfi ilə, metr (m) vahidi ilə","t hərfi ilə, saniyə (s) vahidi ilə","n hərfi ilə, vahidsiz"],["Kanal yaradan, müəyyən sayda qrup traktı formalaşdıran avadanlıq necə adlandırılır?","Kanalyaradıcı (multipleksor) avadanlıqdır.","Demodulyator","Retranslyator","Optik izolyator"],["Kanalyaradıcı avadanlığın çıxışındakı siqnal parametrlərini optik vericinin parametrləri ilə uyğunlaşdıran element necə adlanır?","İnterfeys (uyğunlaşdırıcı) element — elektrooptik modulyatordur.","Kanalyaradıcı element — multipleksordur","Fotodiod","Optik gücləndirici"],["Optik retranslyatorların qurulduğu müəyyən məsafə sahəsi necə adlanır?","Retranslyator intervalı (regenerasiya bölməsi) adlanır.","Kanal intervalı adlanır","Dispersiya zonası adlanır","Qəbul intervalı adlanır"],["Optik siqnalların qəbulu və onların elektrik siqnallarına çevrilməsini təmin edən əsas qurğu necə adlanır?","Fotodetektor (fotodiod) — qəbuledici optik modulun əsas elementi.","Elektrooptik modulyator","Lazer diodu","Optik izolyator"],["Birlifli izoləqli birkəbəlli veriliş sistemlərinin əsas xüsusiyyəti nədən ibarətdir?","Veriliş bir lifdən, qəbul isə ona cütləşmiş digər lifdən həyata keçirilir; quruluş sadədir, lakin lif ehtiyatı iki qat artır.","Eyni lifdə hər iki istiqamətdə veriliş aparılır","Lif ehtiyatı iki qat azalır","Yalnız WDM ilə işləyir"]];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,A,H,cur,AC;
function snd(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,f=ok?[660,880]:[220,150];f.forEach((v,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=v;g.gain.setValueAtTime(.18,t+i*.14);g.gain.exponentialRampToValueAtTime(.001,t+i*.14+.22);o.connect(g);g.connect(AC.destination);o.start(t+i*.14);o.stop(t+i*.14+.25)})}catch(e){}}
function start(){Q=D.map((d,i)=>({i,q:d[0],c:d[1],o:sh(d.slice(1))}));A=Array(Q.length).fill(null);H=Array(Q.length).fill(false);cur=0;show()}
function dots(){const e=document.getElementById('dots');e.innerHTML='';Q.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(i==cur?'cur ':'')+(A[i]==null?'':A[i]==q.c?'ok':'er');b.onclick=()=>{cur=i;show()};e.appendChild(b)});const n=A.filter(x=>x!=null).length;document.getElementById('pb').style.width=n/Q.length*100+'%';document.getElementById('st').textContent=`Cavablanıb: ${n} / ${Q.length}`}
function show(){dots();const q=Q[cur],a=A[cur],m=document.getElementById('main');
m.innerHTML=`<div class="card"><p class="q">${cur+1}. ${q.q}</p><div id="os"></div>
<button class="hint" id="hb">💡 İpucu${H[cur]?`<small>${q.c}</small>`:' (bas)'}</button></div>
<div class="nav"><button class="b g" id="pv" ${cur?'':'disabled'}>← Geri</button><button class="b g" id="fn">Bitir</button><button class="b" id="nx" ${cur<Q.length-1?'':'disabled'}>İrəli →</button></div>`;
const os=document.getElementById('os');
q.o.forEach(t=>{const b=document.createElement('button');b.className='o';b.textContent=t;if(a!=null){b.disabled=true;if(t==q.c)b.classList.add('ok');else if(t==a)b.classList.add('er')}
b.onclick=()=>{if(A[cur]!=null)return;A[cur]=t;snd(t==q.c);show()};os.appendChild(b)});
document.getElementById('hb').onclick=()=>{H[cur]=true;show()};
document.getElementById('pv').onclick=()=>{cur--;show()};document.getElementById('nx').onclick=()=>{cur++;show()};
document.getElementById('fn').onclick=()=>{const left=A.filter(x=>x==null).length;if(left&&!confirm(`${left} sual cavablanmayıb. Yenə də bitirək?`))return;res()}}
function res(){const ok=Q.filter((q,i)=>A[i]==q.c).length,bad=Q.filter((q,i)=>A[i]!=q.c);
document.getElementById('dots').innerHTML='';document.getElementById('pb').style.width='100%';document.getElementById('st').textContent='Nəticə';
document.getElementById('main').innerHTML=`<div class="card" style="text-align:center"><div>Düzgün cavablar</div><div class="big">${ok} / ${Q.length}</div><div>${Math.round(ok/Q.length*100)}%</div></div>
<h2 style="font-size:18px;margin:18px 0 4px">${bad.length?'Səhvlər (sual sırası ilə):':'Səhv yoxdur 🎉'}</h2>`+
bad.map(q=>`<div class="r"><b>${q.i+1}. ${q.q}</b><div class="x">Sizin cavab: ${A[q.i]==null?'cavablanmayıb':A[q.i]}</div><div class="c">Düzgün cavab: ${q.c}</div></div>`).join('')+
'<div class="nav"><button class="b g" id="rv">Testə qayıt</button><button class="b" id="rs">Yenidən başla</button></div>';
document.getElementById('rs').onclick=start;document.getElementById('rv').onclick=()=>{cur=0;show()}}
start();
</script></body></html>
