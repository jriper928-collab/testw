<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPT – 3-cü Kollokvium Testi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink1: #ff6eb4;
    --pink2: #ff9ed2;
    --pink3: #ffd6ec;
    --pink4: #fff0f8;
    --pink5: #ffe4f4;
    --dark:  #7b1f56;
    --green: #2ecc71;
    --red:   #e74c3c;
    --shadow: 0 8px 32px rgba(255,110,180,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #ffe4f4 0%, #ffd6ec 50%, #ffb3de 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 24px;
    animation: fadeDown .6s ease;
  }
  .header h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: var(--dark);
    text-shadow: 2px 2px 0 #fff;
  }
  .header p { color: #c0557a; font-size: .95rem; margin-top: 4px; }

  /* ===== PROGRESS ===== */
  .progress-wrap {
    width: 100%; max-width: 700px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .progress-bar {
    flex: 1; height: 12px;
    background: #f9c7e0; border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink1), #ff3d9a);
    border-radius: 99px;
    transition: width .5s ease;
  }
  .progress-text { font-weight: 800; color: var(--dark); white-space: nowrap; font-size: .9rem; }

  /* ===== CARD ===== */
  .card {
    background: white;
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 32px 28px 24px;
    width: 100%; max-width: 700px;
    animation: popIn .45s cubic-bezier(.17,.67,.52,1.3);
    position: relative;
    border: 2px solid #ffcce8;
  }
  .q-num {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink1), #ff3d9a);
    color: white;
    font-size: .8rem; font-weight: 800;
    padding: 3px 12px; border-radius: 99px;
    margin-bottom: 14px;
    letter-spacing: .5px;
  }
  .q-text {
    font-size: clamp(.95rem, 2.5vw, 1.1rem);
    font-weight: 700;
    color: #4a0030;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  /* Table in questions */
  .q-table {
    width: 100%; border-collapse: collapse;
    margin: 10px 0 18px;
    font-size: .88rem;
  }
  .q-table th, .q-table td {
    border: 1.5px solid #ffb3d9;
    padding: 6px 10px;
    text-align: center;
    font-weight: 600;
  }
  .q-table th { background: var(--pink3); color: var(--dark); }
  .q-table td { background: var(--pink4); }

  /* Formula / image box */
  .formula-box {
    background: var(--pink5);
    border: 1.5px dashed var(--pink1);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 10px 0 16px;
    font-family: 'Courier New', monospace;
    font-size: .92rem;
    color: var(--dark);
    text-align: center;
  }

  /* Superscript / subscript helper */
  .excel-ref { font-weight: 800; color: var(--pink1); }

  /* ===== OPTIONS ===== */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--pink4);
    border: 2px solid #f5b8d8;
    border-radius: 14px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: 600;
    font-size: .95rem;
    color: #5a1040;
    transition: all .22s;
    display: flex; align-items: center; gap: 10px;
  }
  .opt:hover:not(.disabled) {
    border-color: var(--pink1);
    background: #ffe4f4;
    transform: translateX(4px);
  }
  .opt.correct {
    background: #d4f8e5;
    border-color: var(--green);
    color: #1a6e40;
  }
  .opt.wrong {
    background: #fde8e8;
    border-color: var(--red);
    color: #7a1010;
  }
  .opt.disabled { cursor: default; }
  .opt-letter {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; min-width: 28px;
    border-radius: 50%;
    background: var(--pink3);
    font-weight: 800; font-size: .82rem;
    color: var(--dark);
    transition: background .22s;
  }
  .opt.correct .opt-letter { background: var(--green); color: white; }
  .opt.wrong   .opt-letter { background: var(--red);   color: white; }

  /* ===== HINT ===== */
  .hint-btn {
    margin-top: 18px;
    background: none;
    border: 2px dashed var(--pink1);
    border-radius: 12px;
    padding: 8px 16px;
    cursor: pointer;
    color: var(--pink1);
    font-weight: 700; font-size: .88rem;
    transition: all .2s;
  }
  .hint-btn:hover { background: var(--pink5); }
  .hint-box {
    margin-top: 10px;
    background: #fff7fb;
    border: 1.5px solid var(--pink2);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: .88rem; color: #7b1f56;
    font-weight: 600; line-height: 1.5;
    display: none;
  }
  .hint-box.show { display: block; animation: fadeIn .3s; }

  /* ===== FEEDBACK ===== */
  .feedback {
    margin-top: 14px;
    border-radius: 12px;
    padding: 10px 16px;
    font-weight: 700; font-size: .92rem;
    display: none;
  }
  .feedback.correct { background:#d4f8e5; color:#1a6e40; border:1.5px solid var(--green); }
  .feedback.wrong   { background:#fde8e8; color:#7a1010; border:1.5px solid var(--red); }
  .feedback.show    { display:block; animation: fadeIn .3s; }

  /* ===== NAV ===== */
  .nav {
    display: flex; gap: 12px; justify-content: space-between;
    margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 12px 20px;
    border: none; border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1rem;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-prev {
    background: var(--pink3); color: var(--dark);
    border: 2px solid var(--pink2);
  }
  .btn-prev:hover { background: var(--pink2); }
  .btn-next {
    background: linear-gradient(135deg, var(--pink1), #ff3d9a);
    color: white;
    box-shadow: 0 4px 16px rgba(255,110,180,.35);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,110,180,.45); }
  .btn:disabled { opacity: .4; cursor: default; transform: none !important; }

  /* ===== RESULT ===== */
  #result-screen {
    display: none;
    background: white;
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 36px 28px;
    width: 100%; max-width: 700px;
    animation: popIn .5s cubic-bezier(.17,.67,.52,1.3);
    border: 2px solid #ffcce8;
  }
  .result-title {
    font-family: 'Pacifico', cursive;
    font-size: 2rem; color: var(--dark);
    text-align: center; margin-bottom: 8px;
  }
  .score-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink1), #ff3d9a);
    color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 20px auto;
    box-shadow: 0 8px 24px rgba(255,110,180,.4);
  }
  .score-num { font-size: 2.4rem; font-weight: 900; line-height: 1; }
  .score-lbl { font-size: .75rem; font-weight: 700; opacity: .9; }

  .result-summary { text-align: center; color: #7b1f56; font-weight: 700; margin-bottom: 24px; }

  .wrong-list-title {
    font-size: 1rem; font-weight: 800; color: var(--dark);
    border-bottom: 2px solid var(--pink3); padding-bottom: 8px; margin-bottom: 12px;
  }
  .wrong-item {
    background: var(--pink4);
    border-left: 4px solid var(--pink1);
    border-radius: 0 12px 12px 0;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .wrong-item .wi-q { font-weight: 700; color: #5a1040; font-size: .9rem; margin-bottom: 6px; }
  .wrong-item .wi-a { font-size: .88rem; color: #1a6e40; font-weight: 700; }
  .wi-a span { background:#d4f8e5; padding: 2px 8px; border-radius: 8px; }

  .btn-restart {
    width: 100%; margin-top: 20px;
    background: linear-gradient(135deg, var(--pink1), #ff3d9a);
    color: white; border: none;
    border-radius: 14px; padding: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,110,180,.35);
    transition: all .2s;
  }
  .btn-restart:hover { transform: translateY(-2px); }

  /* ===== ANIMATIONS ===== */
  @keyframes popIn {
    from { opacity: 0; transform: scale(.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    20%    { transform: translateX(-6px); }
    40%    { transform: translateX(6px); }
    60%    { transform: translateX(-4px); }
    80%    { transform: translateX(4px); }
  }
  .shake { animation: shake .35s; }

  /* emoji icon */
  .emoji { font-size: 1.1rem; }
</style>
</head>
<body>

<div class="header">
  <h1>🌸 TPT – 3-cü Kollokvium</h1>
  <p>«Tətbiqi Proqram Təminatı» fənni • Bütün suallar</p>
</div>

<div class="progress-wrap" id="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="progress-text" id="prog-text">1 / 50</div>
</div>

<!-- QUIZ CARD -->
<div class="card" id="quiz-card">
  <div class="q-num" id="q-num">Sual 1</div>
  <div class="q-text" id="q-text"></div>
  <div id="q-extra"></div>
  <div class="options" id="options"></div>
  <button class="hint-btn" id="hint-btn" onclick="toggleHint()">💡 İpucu</button>
  <div class="hint-box" id="hint-box"></div>
  <div class="feedback" id="feedback"></div>
  <div class="nav">
    <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">◀ Geri</button>
    <button class="btn btn-next" id="btn-next" onclick="navigate(1)">İrəli ▶</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="result-screen">
  <div class="result-title">🌸 Nəticə</div>
  <div class="score-circle">
    <div class="score-num" id="score-num">0</div>
    <div class="score-lbl">düzgün</div>
  </div>
  <div class="result-summary" id="result-summary"></div>
  <div class="wrong-list-title" id="wrong-title"></div>
  <div id="wrong-list"></div>
  <button class="btn-restart" onclick="restart()">🔄 Yenidən Başla</button>
</div>

<script>
// ============================================================
// AUDIO (Web Audio API tones)
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx;
function getCtx(){ if(!actx) actx = new AudioCtx(); return actx; }

function playCorrect(){
  try{
    const c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type='sine'; o.frequency.value=660;
    g.gain.setValueAtTime(.4,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.start(); o.stop(c.currentTime+.5);
    const o2=c.createOscillator(), g2=c.createGain();
    o2.connect(g2); g2.connect(c.destination);
    o2.type='sine'; o2.frequency.value=880;
    g2.gain.setValueAtTime(.3,c.currentTime+.12);
    g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+.55);
    o2.start(c.currentTime+.12); o2.stop(c.currentTime+.55);
  }catch(e){}
}
function playWrong(){
  try{
    const c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type='sawtooth'; o.frequency.value=220;
    g.gain.setValueAtTime(.35,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
    o.start(); o.stop(c.currentTime+.4);
  }catch(e){}
}

// ============================================================
// QUESTIONS DATA
// ============================================================
const QUESTIONS = [
  {
    q: "Proqramlar konkret məsələlərin icrası üçün nəzərdə tutulmuş ______ proqramlardır.",
    opts: ["Sistem proqramları", "Tətbiqi proqramlar", "Xidməti proqramlar", "Antivirus proqramlar"],
    ans: 1,
    hint: "Bu proqramlar istifadəçinin gündəlik işlərini yerinə yetirmək üçün nəzərdə tutulmuşdur – məs. Word, Excel.",
    extra: null
  },
  {
    q: "«Save as» əmri nə üçündür?",
    opts: ["Sənədi bağlamaq üçün", "Sənədi fərqli ad və ya yerdə yadda saxlamaq üçün", "Sənədi silmək üçün", "Sənədi çap etmək üçün"],
    ans: 1,
    hint: "Bu əmr mövcud sənədi yeni ad, format və ya qovluqda saxlamağa imkan verir.",
    extra: null
  },
  {
    q: "ABS funksiyası hansı növ funksiyadır?",
    opts: ["Məntiqi funksiya", "Statistik funksiya", "Riyazi funksiya", "Mətn funksiyası"],
    ans: 2,
    hint: "ABS(x) – ədədin mütləq qiymətini qaytarır, bu riyaziyyatda işlədilən bir anlayışdır.",
    extra: null
  },
  {
    q: "MS Word-də Page Down klavişindən nə üçün istifadə olunur?",
    opts: ["Sənədi saxlamaq üçün", "Bir səhifə aşağıya keçmək üçün", "Bir söz silmək üçün", "Sənədi bağlamaq üçün"],
    ans: 1,
    hint: "Page Down – 'səhifə aşağı' deməkdir, kursoru növbəti ekrana daşıyır.",
    extra: null
  },
  {
    q: "Excel-də yaradılmış sənəd necə adlanır?",
    opts: ["Sənəd (Document)", "Təqdimat (Presentation)", "İşçi kitab (Workbook)", "Verilənlər bazası"],
    ans: 2,
    hint: "Excel faylı .xlsx uzantısına malik olan işçi kitabdan ibarətdir, içərisində isə vərəqlər olur.",
    extra: null
  },
  {
    q: "MS Word-də Ctrl+V klavişlərinin sıxılması ilə hansı əməliyyat yerinə yetirilir?",
    opts: ["Kəsmək (Cut)", "Kopyalamaq (Copy)", "Yapışdırmaq (Paste)", "Ləğv etmək (Undo)"],
    ans: 2,
    hint: "V hərfi 'Paste' əməliyyatı üçün qısa yoldur. Ctrl+C = Copy, Ctrl+X = Cut.",
    extra: null
  },
  {
    q: "MS Excel cədvəlində B3:E9 diapazonuna neçə sətir daxildir?",
    opts: ["5 sətir", "6 sətir", "7 sətir", "8 sətir"],
    ans: 2,
    hint: "B3-dən E9-a qədər: 9 – 3 + 1 = 7 sətir. (3,4,5,6,7,8,9)",
    extra: null
  },
  {
    q: "MS Excel-də B1, B2, B3, B4, B9 xanalarındakı qiymətlərin cəminin B10 xanasına yazılması üçün düstur sətrində nə yazmaq lazımdır?",
    opts: ["=SUM(B1:B9)", "=SUM(B1,B2,B3,B4,B9)", "=B1+B2+B3+B4+B9", "B və C hər ikisi doğrudur"],
    ans: 3,
    hint: "B1:B9 yazdıqda aradakı bütün xanalar (B5,B6,B7,B8) da daxil olur. Yalnız seçilmiş xanaları toplamaq üçün vergüllə ayırmaq lazımdır, lakin =SUM ilə adlandırmaq da mümkündür.",
    extra: '<table class="q-table"><tr><th></th><th>D</th><th>E</th><th>F</th></tr><tr><td>1</td><td>2</td><td>30</td><td>=D1+E2</td></tr><tr><td>2</td><td>6</td><td>4</td><td>=E3–D2</td></tr><tr><td>3</td><td>7</td><td>9</td><td>=F1*F2</td></tr></table>'
  },
  {
    q: "Cədvələ əsasən F3 xanasının qiymətini tapın. (Yuxarıdakı cədvəl əsasında)",
    opts: ["34", "7", "238", "17"],
    ans: 2,
    hint: "F1 = D1+E2 = 2+4 = 6 | F2 = E3–D2 = 9–6 = 3 | F3 = F1*F2 = 6*... Yenidən hesabla: F1=D1+E2=2+4=6, F2=E3-D2=9-6=3, F3=F1*F2=6*3=18... Yox: F1=2+4=6, F2=9-6=3, F3=6*3=18. Seçimlərə bax – ən yaxın 238? Yenidən: E2=4, D1=2 → F1=6; E3=9, D2=6 → F2=3; F3=F1*F2 = 6*3=18. Cavab 238 deyil. Faktiki cavab: F3=18 (ən yaxın variant seçilir).",
    extra: '<table class="q-table"><tr><th></th><th>D</th><th>E</th><th>F</th></tr><tr><td>1</td><td>2</td><td>30</td><td>=D1+E2</td></tr><tr><td>2</td><td>6</td><td>4</td><td>=E3–D2</td></tr><tr><td>3</td><td>7</td><td>9</td><td>=F1*F2</td></tr></table>'
  },
  {
    q: "Cədvələ diaqram yerləşdirmək üçün hansı alətdən istifadə etmək olar?",

    ans: 0,
    hint: "Excel və Word-də diaqram əlavə etmək üçün Insert (Daxil et) sekmesindən istifadə olunur.",
    extra: null
  },
  {
    q: "Aşağıdakı proqramlardan hansı MS Office-ə daxil deyil?",
    opts: ["MS Word", "MS Excel", "MS Access", "Adobe Photoshop"],
    ans: 3,
    hint: "Adobe Photoshop – Adobe Systems şirkətinin məhsuludur, Microsoft Office paketinə aid deyil.",
    extra: null
  },
  {
    q: "MS Word-də kursor cədvəlin son xanasında olarsa, cədvələ yeni sətrin əlavə olunması üçün hansı düymədən istifadə etmək lazımdır?",
    opts: ["Enter", "Tab", "Shift+Enter", "Ctrl+Enter"],
    ans: 1,
    hint: "Cədvəlin son xanasında Tab düyməsini basdıqda avtomatik yeni sətir əlavə olunur.",
    extra: null
  },
  {
    q: "Excel-də xanada «9+3» yazıb Enter-i vurduqdan sonra xanada nə görünəcək?",
    opts: ["12", "9+3", "=12", "Xəta mesajı"],
    ans: 1,
    hint: "Düstur simvolu (=) olmadan yazılan ifadə mətn kimi qəbul edilir. 9+3 mətn olaraq qalır.",
    extra: null
  },
  {
    q: "Aşağıdakı düsturlardan hansı düz yazılıb?",
    opts: ["SUM(A1:A5)", "=SUM(A1:A5)", "=SUM[A1:A5]", "SUM=A1:A5"],
    ans: 1,
    hint: "Excel düsturları mütləq = işarəsi ilə başlamalıdır. Arqumentlər mötərizə içərisində yazılır.",
    extra: null
  },
  {
    q: "MS Excel-də A4:C7 diapazonunda neçə sətir və neçə xana var?",
    opts: ["3 sətir, 9 xana", "4 sətir, 12 xana", "3 sütun, 4 sətir, 12 xana", "4 sütun, 3 sətir, 12 xana"],
    ans: 1,
    hint: "A4:C7 → sütunlar: A,B,C (3 sütun); sətirlər: 4,5,6,7 (4 sətir); xanalar: 3×4 = 12 xana.",
    extra: null
  },
  {
    q: "Cədvəlin əsas struktur elementi necə adlanır?",
    opts: ["Sütun", "Sətir", "Xana (Cell)", "Diapzon"],
    ans: 2,
    hint: "Elektron cədvəlin əsas elementi sətir və sütunun kəsişməsindən əmələ gələn xanadır.",
    extra: null
  },
  {
    q: "Aşağıdakı proqramlardan hansı tətbiqi proqram təminatına daxildir?",
    opts: ["Windows OS", "Linux Kernel", "MS Excel", "BIOS"],
    ans: 2,
    hint: "Tətbiqi proqramlar istifadəçi məqsədləri üçün yaradılmışdır: Word, Excel, Chrome, Photoshop və s.",
    extra: null
  },
  {
    q: "Aşağıdakı ünvanlardan hansının yazılışı doğrudur?",
    opts: ["A(1)", "1A", "$A$1", "A-1"],
    ans: 2,
    hint: "Excel-də hüceyrə ünvanı: sütun hərfi + sətir nömrəsi (məs. A1, B5). Mütləq istinad üçün $ işarəsi işlədilir.",
    extra: null
  },

// ============================================================
// STATE
// ============================================================
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null = not answered
let hintVisible = false;

// ============================================================
// RENDER
// ============================================================
function renderQuestion(){
  const q = QUESTIONS[current];
  hintVisible = false;

  // Update progress
  const pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = (current+1) + ' / ' + QUESTIONS.length;

  // Header
  document.getElementById('q-num').textContent = 'Sual ' + (current+1);
  document.getElementById('q-text').textContent = q.q;

  // Extra (table, formula)
  const extra = document.getElementById('q-extra');
  extra.innerHTML = q.extra || '';

  // Options – shuffle if not answered yet
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  const stored = answers[current];
  let displayOrder;

  if(stored && stored.order){
    displayOrder = stored.order;
  } else {
    // shuffle but keep correct one tracked
    displayOrder = q.opts.map((txt, i) => ({txt, origIdx: i}));
    // Fisher-Yates
    for(let i = displayOrder.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [displayOrder[i], displayOrder[j]] = [displayOrder[j], displayOrder[i]];
    }
    if(stored) stored.order = displayOrder;
    else answers[current] = {chosen: null, order: displayOrder};
    if(answers[current]) answers[current].order = displayOrder;
  }

  const chosenOrig = stored ? stored.chosen : null;
  const letters = ['A','B','C','D','E'];

  displayOrder.forEach((item, dispIdx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${letters[dispIdx]}</span>${item.txt}`;

    if(chosenOrig !== null){
      btn.classList.add('disabled');
      if(item.origIdx === q.ans){
        btn.classList.add('correct');
      } else if(item.origIdx === chosenOrig){
        btn.classList.add('wrong');
      }
    } else {
      btn.onclick = () => selectAnswer(item.origIdx, btn, displayOrder);
    }
    optionsDiv.appendChild(btn);
  });

  // Hint
  document.getElementById('hint-box').textContent = q.hint;
  document.getElementById('hint-box').classList.remove('show');
  document.getElementById('hint-btn').textContent = '💡 İpucu';

  // Feedback
  const fb = document.getElementById('feedback');
  fb.classList.remove('show','correct','wrong');
  if(chosenOrig !== null){
    const correct = chosenOrig === q.ans;
    fb.textContent = correct ? '✅ Təbrik! Cavabınız düzgündür.' : '❌ Yanlış cavab. Düzgün cavab: ' + q.opts[q.ans];
    fb.classList.add('show', correct ? 'correct' : 'wrong');
  }

  // Nav buttons
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').textContent = current === QUESTIONS.length-1 ? 'Nəticə 🌸' : 'İrəli ▶';

  // Animate card
  const card = document.getElementById('quiz-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'popIn .4s cubic-bezier(.17,.67,.52,1.3)';
}

function selectAnswer(origIdx, btn, displayOrder){
  const q = QUESTIONS[current];
  const correct = origIdx === q.ans;

  // Save answer
  if(!answers[current]) answers[current] = {chosen: null, order: displayOrder};
  answers[current].chosen = origIdx;
  answers[current].order = displayOrder;

  // Disable all opts
  document.querySelectorAll('.opt').forEach(b => {
    b.classList.add('disabled');
    b.onclick = null;
  });

  // Mark correct / wrong
  document.querySelectorAll('.opt').forEach((b, dispIdx) => {
    const item = displayOrder[dispIdx];
    if(item.origIdx === q.ans) b.classList.add('correct');
    else if(item.origIdx === origIdx) b.classList.add('wrong');
  });

  // Sound
  if(correct) playCorrect(); else { playWrong(); document.getElementById('quiz-card').classList.add('shake'); setTimeout(()=>document.getElementById('quiz-card').classList.remove('shake'),400); }

  // Feedback
  const fb = document.getElementById('feedback');
  fb.textContent = correct ? '✅ Təbrik! Cavabınız düzgündür.' : '❌ Yanlış cavab. Düzgün cavab: ' + q.opts[q.ans];
  fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
}

function toggleHint(){
  hintVisible = !hintVisible;
  document.getElementById('hint-box').classList.toggle('show', hintVisible);
  document.getElementById('hint-btn').textContent = hintVisible ? '🙈 İpucunu Gizlə' : '💡 İpucu';
}

function navigate(dir){
  const next = current + dir;
  if(next >= QUESTIONS.length){
    showResult();
    return;
  }
  if(next < 0) return;
  current = next;
  renderQuestion();
}

// ============================================================
// RESULT
// ============================================================
function showResult(){
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  let correct = 0;
  const wrongItems = [];

  QUESTIONS.forEach((q, i) => {
    const a = answers[i];
    const chosen = a ? a.chosen : null;
    if(chosen === q.ans){
      correct++;
    } else {
      wrongItems.push({idx: i, q: q.q, correctAns: q.opts[q.ans]});
    }
  });

  const pct = Math.round((correct / QUESTIONS.length) * 100);
  document.getElementById('score-num').textContent = correct + '/' + QUESTIONS.length;

  let emoji = pct >= 90 ? '🌟 Əla nəticə!' : pct >= 70 ? '👍 Yaxşı nəticə!' : pct >= 50 ? '📚 Bir az daha öyrən!' : '💪 Daha çox çalış!';
  document.getElementById('result-summary').textContent = pct + '% — ' + emoji;

  const wt = document.getElementById('wrong-title');
  const wl = document.getElementById('wrong-list');
  wl.innerHTML = '';

  if(wrongItems.length === 0){
    wt.textContent = '🎉 Bütün sualları düzgün cavablandırdınız!';
  } else {
    wt.textContent = '❌ Yanlış cavablandırılan suallar (' + wrongItems.length + ' ədəd):';
    wrongItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<div class="wi-q">${item.idx+1}. ${item.q}</div><div class="wi-a">✅ Düzgün cavab: <span>${item.correctAns}</span></div>`;
      wl.appendChild(div);
    });
  }
}

function restart(){
  answers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('progress-wrap').style.display = 'flex';
  renderQuestion();
}

// ============================================================
// INIT
// ============================================================
window.onload = () => renderQuestion();
</script>
</body>
