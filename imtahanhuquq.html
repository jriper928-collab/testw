<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hüquq Testi</title>
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-color: #5d4037;
            --primary-color: #bcaaa4;
            --accent-color: #8d6e63;
            --correct-color: #a5d6a7;
            --wrong-color: #ef9a9a;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(141, 110, 99, 0.15);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 14px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f5ebe6;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: #81c784;
            color: #1b5e20;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: #e57373;
            color: #b71c1c;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #6d4c41;
        }

        .btn:disabled {
            background-color: #d7ccc8;
            cursor: not-allowed;
        }

        .hint-btn {
            background-color: #dfd5d0;
            color: var(--text-color);
        }

        .hint-text {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff9c4;
            border-left: 4px solid #fbc02d;
            border-radius: 4px;
            display: none;
            font-size: 0.95rem;
        }

        .result-section {
            display: none;
        }

        .result-item {
            background: #fff5f5;
            border-left: 4px solid var(--wrong-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .result-item strong {
            color: #c62828;
        }

        .correct-answer-view {
            margin-top: 8px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <div class="header">
            <span id="progress">Sual: 1 / 45</span>
            <span id="score">Xal: 0</span>
        </div>
        <div class="question" id="question-text">Sual mətni bura gələcək.</div>
        <div class="options" id="options-box"></div>
        
        <div class="hint-text" id="hint-box"></div>

        <div class="navigation">
            <button class="btn" id="prev-btn" onclick="prevQuestion()">Geri</button>
            <button class="btn hint-btn" id="hint-toggle-btn" onclick="toggleHint()">İpucu 💡</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">İrəli</button>
        </div>
    </div>

    <div id="result-box" class="result-section">
        <h2>Test bitdi! 🎉</h2>
        <p id="final-score">Sizin yekun xalınız: </p>
        <hr style="border: 1px solid var(--primary-color); margin: 20px 0;">
        <h3 id="wrong-title">Səhv cavab verilən suallar və düzgün izahları:</h3>
        <div id="wrong-questions-list"></div>
        <button class="btn" onclick="location.reload()" style="margin-top: 15px; width: 100%;">Yenidən Başla</button>
    </div>
</div>

// Səslər funksiyası (Audio sintezi ilə real vaxtda bip səsi çıxarır)
function playSound(type) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'correct') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Düz cavab - xoş səs
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
    } else {
        osc.frequency.setValueAtTime(120, ctx.currentTime); // Səhv cavab - qalın səs
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
    }
}

let currentIdx = 0;
let score = 0;
let userAnswers = new Array(quizData.length).fill(null);
let wrongQuestions = [];

function loadQuestion() {
    const qData = quizData[currentIdx];
    document.getElementById("progress").innerText = `Sual: ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById("question-text").innerText = qData.q;
    
    const optionsBox = document.getElementById("options-box");
    optionsBox.innerHTML = "";
    
    // İpucunu gizlət və mətnini yenilə
    const hintBox = document.getElementById("hint-box");
    hintBox.style.display = "none";
    hintBox.innerText = `Doğru Cavab: ${qData.a}`;

    qData.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        
        // Əgər istifadəçi artıq bu suala cavab veribsə, rəngləri saxla
        if (userAnswers[currentIdx] !== null) {
            btn.disabled = true;
            if (opt === qData.a) {
                btn.classList.add("correct");
            }
            if (userAnswers[currentIdx] === opt && opt !== qData.a) {
                btn.classList.add("wrong");
            }
        } else {
            btn.onclick = () => checkAnswer(opt, btn);
        }
        
        optionsBox.appendChild(btn);
    });

    // Düymələrin aktivlik vəziyyəti
    document.getElementById("prev-btn").disabled = currentIdx === 0;
    document.getElementById("next-btn").innerText = currentIdx === quizData.length - 1 ? "Bitir" : "İrəli";
}

function checkAnswer(selectedOpt, btn) {
    const qData = quizData[currentIdx];
    userAnswers[currentIdx] = selectedOpt;

    const allButtons = document.querySelectorAll(".option-btn");
    allButtons.forEach(b => b.disabled = true);

    if (selectedOpt === qData.a) {
        btn.classList.add("correct");
        score += 10;
        document.getElementById("score").innerText = `Xal: ${score}`;
        playSound('correct');
    } else {
        btn.classList.add("wrong");
        playSound('wrong');
        // Düzgün variantı da vizual olaraq göstər
        allButtons.forEach(b => {
            if (b.innerText === qData.a) b.classList.add("correct");
        });
        // Səhv cavablar siyahısına əlavə et
        if (!wrongQuestions.some(item => item.q === qData.q)) {
            wrongQuestions.push({ q: qData.q, a: qData.a });
        }
    }
}

function toggleHint() {
    const hintBox = document.getElementById("hint-box");
    if (hintBox.style.display === "none") {
        hintBox.style.display = "block";
    } else {
        hintBox.style.display = "none";
    }
}

function nextQuestion() {
    if (currentIdx < quizData.length - 1) {
        currentIdx++;
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
    }
}

function showResults() {
    document.getElementById("quiz-box").style.display = "none";
    const resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    document.getElementById("final-score").innerText = `Sizin yekun xalınız: ${score} (Maksimum mümkün xal: ${quizData.length * 10})`;

    const wrongList = document.getElementById("wrong-questions-list");
    wrongList.innerHTML = "";

    if (wrongQuestions.length === 0) {
        document.getElementById("wrong-title").innerText = "Təbriklər! Heç bir suala səhv cavab vermədiniz. 🌟";
    } else {
        wrongQuestions.forEach(item => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerHTML = `<div><strong>Sual:</strong> ${item.q}</div><div class="correct-answer-view">Düzgün Cavab: ${item.a}</div>`;
            wrongList.appendChild(div);
        });
    }
}

// İlk sualı yüklə
loadQuestion();
</script>

</body>
</html>
