*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}

.sub{color:var(--mu);font-size:.9rem;margin-bottom:16px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}

.qn{color:var(--ac);font-weight:600;font-size:.85rem;margin-bottom:6px}
.q{font-size:1.1rem;font-weight:600;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);background:#f2f6ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--er);background:var(--erb)}
.opt.hl{border-color:#e0a800;background:var(--hint)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;background:var(--ac);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#e9eef6;color:var(--tx)}
.btn:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.hint{display:none;margin-top:12px;background:var(--hint);border:1px solid #f0d98a;border-radius:10px;padding:10px 14px;font-size:.95rem}
.hint.on{display:block}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.grid button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:#fff;font:inherit;font-size:.8rem;cursor:pointer}
.grid .cur{outline:2px solid var(--ac)}
.grid .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid .no{background:var(--er);color:#fff;border-color:var(--er)}
.score{font-size:2.6rem;font-weight:700;text-align:center;margin:6px 0}
.stats{text-align:center;color:var(--mu);margin-bottom:18px}
.mis{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.mis b{display:block;margin-bottom:6px}
.mis .w{color:var(--er)}.mis .r{color:var(--ok)}
.hide{display:none}

function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;const notes=ok?[[660,0],[880,.12]]:[[220,0],[160,.15]];notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.15,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.3)})}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){S={i:0,ans:D.map(()=>null),hint:D.map(()=>false),opts:D.map(d=>shuffle([d[1],...d[2]])),done:false};render()}

 let h=`<div class="bar"><i style="width:${cnt/n*100}%"></i></div><div class="card"><div class="qn">Sual ${S.i+1} / ${n}</div><div class="q">${d[0]}</div>`;
 S.opts[S.i].forEach((o,k)=>{let c='opt';if(a!==null){if(o===d[1])c+=' ok';else if(k===a)c+=' no'}else if(S.hint[S.i]&&o===d[1])c+=' hl';
  h+=`<button class="${c}" data-k="${k}" ${a!==null?'disabled':''}>${o}</button>`});
 h+=`<div class="hint ${S.hint[S.i]?'on':''}"><b>💡 İpucu:</b> düzgün cavab — ${d[1]}</div>
 <div class="row"><button class="btn g" id="hb" ${a!==null?'disabled':''}>💡 İpucu</button><span class="sp"></span>
 <button class="btn g" id="pv" ${S.i==0?'disabled':''}>← Əvvəlki</button>
 ${S.i<n-1?'<button class="btn" id="nx">Növbəti →</button>':'<button class="btn" id="fin">Nəticə</button>'}</div></div>
 <div class="grid">${D.map((_,j)=>{let c=j==S.i?'cur':'';if(S.ans[j]!==null)c+=S.opts[j][S.ans[j]]===D[j][1]?' ok':' no';return `<button class="${c}" data-j="${j}">${j+1}</button>`}).join('')}</div>
 <div class="row"><button class="btn g" id="fin2">Testi bitir və nəticəni gör</button></div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.ans[S.i]=k;beep(S.opts[S.i][k]===d[1]);render()});
 app.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;render()});
 const $=id=>document.getElementById(id);
 $('hb').onclick=()=>{S.hint[S.i]=true;render()};
 $('pv').onclick=()=>{S.i--;render()};
 if($('nx'))$('nx').onclick=()=>{S.i++;render()};
 if($('fin'))$('fin').onclick=finish;$('fin2').onclick=finish;
}
function finish(){S.done=true;render()}
function result(){
 let ok=0,wr=[],sk=[];D.forEach((d,j)=>{const a=S.ans[j];if(a===null)sk.push(j);else if(S.opts[j][a]===d[1])ok++;else wr.push(j)});
 const p=Math.round(ok/D.length*100),hs=S.hint.filter(Boolean).length;
 let h=`<div class="card"><div class="score" style="color:${p>=60?'var(--ok)':'var(--er)'}">${ok} / ${D.length}</div><div class="stats">${p}% · düzgün ${ok} · səhv ${wr.length} · cavabsız ${sk.length} · ipucu ${hs}</div>`;
 if(wr.length+sk.length){h+=`<h3>Səhvlər və buraxılanlar</h3>`;
  [...wr,...sk].sort((x,y)=>x-y).forEach(j=>{const a=S.ans[j];h+=`<div class="mis"><b>${j+1}. ${D[j][0]}</b>${a!==null?`<div class="w">✗ Sizin cavab: ${S.opts[j][a]}</div>`:'<div class="w">— Cavablandırılmayıb</div>'}<div class="r">✓ Düzgün cavab: ${D[j][1]}</div></div>`})}
 else h+='<p style="text-align:center">🎉 Hamısı düzgündür!</p>';
 h+=`<div class="row"><button class="btn g" id="rv">Testə qayıt</button><button class="btn" id="rs">Yenidən başla</button></div></div>`;
 app.innerHTML=h;
 document.getElementById('rs').onclick=start;
 document.getElementById('rv').onclick=()=>{S.done=false;S.i=0;render()};
 beep(p>=60);
}
start();
</script>
</body>
</html>
