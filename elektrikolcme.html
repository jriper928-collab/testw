<style>
:root{--bg:#120a1a;--card:#1f1230;--ink:#f3e9ff;--mut:#a995c4;--or:#ff7a1a;--pu:#8a4bff;--ok:#38d27a;--no:#ff4d5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 80% 0,#3a1659 0,var(--bg) 55%) fixed;color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif;min-height:100vh}

.moon{position:fixed;top:12px;right:16px;font-size:44px;opacity:.85;pointer-events:none}
.bar{height:8px;background:#2d1b44;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--or));transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid #3b2560;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 0 24px #8a4bff22}
.q{font-size:19px;margin:0 0 14px}
.o{display:block;width:100%;text-align:left;background:#2a1844;color:var(--ink);border:2px solid #45296c;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--or)}
.o.ok{background:#12402a;border-color:var(--ok)}.o.no{background:#4a1520;border-color:var(--no);animation:sh .4s}
.o:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{flex:1;min-width:110px;background:var(--pu);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.b.or{background:var(--or);color:#2a1100}.b.g{background:#3b2560}.b:disabled{opacity:.4;cursor:default}
.hint{display:none;margin-top:10px;padding:10px 12px;border:1px dashed var(--or);border-radius:12px;color:#ffd9b8;background:#2e1a10}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dots span{width:20px;height:20px;border-radius:50%;background:#2d1b44;font-size:10px;text-align:center;line-height:20px;cursor:pointer;color:var(--mut)}
.dots .a{background:var(--ok);color:#022}.dots .w2{background:var(--no);color:#fff}.dots .c{outline:2px solid var(--or)}
.big{font-size:56px;text-align:center;color:var(--or)}
.err{border-left:4px solid var(--no);padding:8px 12px;margin:10px 0;background:#2a1520;border-radius:8px}
.err small{color:var(--mut);display:block}
.hide{display:none}
</style></head><body>

["Elektrik ölçmələri anlayışı nəyi ifadə edir?","Normalaşdırılmış metroloji xarakterə malik xüsusi texniki vasitəni","Yalnız elektrik enerjisinin istehsalını","Elektrik şəbəkələrinin layihələndirilməsini","Elektrik cihazlarının satışını"],
["SI abreviaturası nəyi ifadə edir?","Beynəlxalq vahidlər sistemi","Standart induksiya","Statistik idarəetmə","Sənaye institutu"],
["SI sisteminin əsas üstünlüyü nədir?","Bütün ölçü vahidləri vahid sistemdə birləşdirilir","Yalnız bir ölkədə işlədilir","Hər kəmiyyət üçün ayrı sistem var","Vahidlər arasında əlaqə yoxdur"],
["Tezliyin vahidi olan Hers (Hz) əsas vahidlərlə necə ifadə olunur?","1/san (san⁻¹)","kq·m/san","A·san","m/san"],
["Birbaşa ölçmədə nəticə necə müəyyən edilir?","Fiziki kəmiyyətin qiyməti cihazın göstərişinə əsasən təyin edilir","Başqa kəmiyyətlərdən düsturla hesablanır","Yalnız etalonla müqayisə edilir","Təxmini qiymətləndirmə ilə"],
["Dolayı ölçməyə hansı xüsusiyyət aiddir?","Axtarılan kəmiyyət birbaşa ölçülmür, ölçülən kəmiyyətlərin asılılığından təyin olunur","Nəticə cihazdan birbaşa oxunur","Fərq həmişə sıfıra gətirilir","Nümunəvi ölçü tələb olunmur və hesablama aparılmır"],
["Müqayisə metodu nəyə əsaslanır?","Ölçülən kəmiyyətin nümunəvi ölçü kimi göstərilmiş kəmiyyətlə müqayisəsinə","Kəmiyyətin hesablanmasına","Cihazın şkalasından oxumağa","Təsadüfi seçməyə"],
["Kompensasiya (sıfır) metodu nədir?","Nümunəvi qiymətlə ölçülən qiymətin fərqi sıfıra gətirilir","Fərq maksimum edilir","Yalnız nümunəvi qiymət ölçülür","Fərq nəzərə alınmır"],
["Diferensial metodda əsasən nə ölçülür?","ΔU ≠ 0 — nümunəvi və ölçülən qiymətlər arasındakı fərq ölçülür","Fərq həmişə sıfır olur","Yalnız nümunəvi qiymət","Cərəyanın istiqaməti"],
["Birbaşa qiymətləndirmə metodunda nə edilir?","Kəmiyyət birbaşa qiymətləndirilir (nəticə cihazdan oxunur)","Fərq sıfıra gətirilir","Kəmiyyət düsturla hesablanır","Nümunəvi ölçü ilə əvəz edilir"],

["Rəqəmsal ölçü cihazlarının üstünlüyü hansıdır?","Çox cəld işləmə qabiliyyəti; ölçmə dəqiqliyi çox yüksəkdir; yüksək həssaslıq və həll etmək qabiliyyəti; nəticəni qeyd etmək və hesablamaq asandır; ölçmə prosesinin avtomatik qeydi asandır; dəqiqliyi itirmədən məlumatın məsafəyə ötürülməsi və yadda saxlanması; xətaları azaltmaq mümkündür","Yavaş işləmə qabiliyyəti; ölçmə dəqiqliyi aşağıdır; həssaslıq zəifdir; nəticəni yalnız əl ilə qeyd etmək olur; məlumatı məsafəyə ötürmək mümkün deyil; xətalar artır","Çox cəld işləmə qabiliyyəti; ölçmə dəqiqliyi orta səviyyədədir; həssaslıq aşağıdır; nəticəni yalnız kağızda hesablamaq olur; məlumatı yadda saxlamaq mümkün deyil","Sadə quruluş və ucuz qiymət; ölçmə dəqiqliyi çox yüksəkdir; lakin nəticəni qeyd etmək çətindir; avtomatik qeyd mümkün deyil; xətalar azaldıla bilməz"],

const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=D.map(d=>({q:d[0],a:d[1],o:sh(d.slice(1))})); // sıra saxlanır, variantlar qarışdırılır
let i=0,pick=Array(Q.length).fill(null),hint=Array(Q.length).fill(false),AC;
const $=s=>document.querySelector(s);
function tone(f,d,t='sine',s=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime+s);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+s+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+s);o.stop(AC.currentTime+s+d)}catch(e){}}
const good=()=>{tone(523,.15,'triangle');tone(659,.15,'triangle',.12);tone(784,.3,'triangle',.24)};
const bad=()=>{tone(180,.25,'sawtooth');tone(120,.45,'sawtooth',.2)};
function start(){$('#app').innerHTML=`<div class="card"><div class="big">🕸️🎃</div><p style="text-align:center">Kollokvium sualları (${Q.length} sual). Düzgün cavab seçsən şən səs, səhv seçsən qorxulu səs eşidəcəksən. 💡 ipucu düyməsi düzgün cavabı göstərir. Suallar arasında istədiyin qədər irəli-geri keçə bilərsən.</p><div class="row"><button class="b or" onclick="i=0;render()">Başla 🦇</button></div></div>`}
function render(){
const x=Q[i],p=pick[i],done=p!==null,n=pick.filter(v=>v!==null).length;
$('#app').innerHTML=`<div class="meta"><span>Sual ${i+1} / ${Q.length}</span><span>Cavablanıb: ${n}</span></div>
<div class="bar"><i style="width:${n/Q.length*100}%"></i></div>
<div class="card"><p class="q">${i+1}. ${x.q}</p>
${x.o.map((t,k)=>{let c='';if(done){if(t===x.a)c='ok';else if(k===p)c='no'}return `<button class="o ${c}" ${done?'disabled':''} onclick="ans(${k})">${t}</button>`}).join('')}
<div class="hint" id="h" style="display:${hint[i]?'block':'none'}">💡 İpucu – düzgün cavab: <b>${x.a}</b></div>
<div class="row"><button class="b g" onclick="go(-1)" ${i==0?'disabled':''}>← Əvvəlki</button><button class="b g" onclick="showHint()">💡 İpucu</button><button class="b g" onclick="go(1)" ${i==Q.length-1?'disabled':''}>Növbəti →</button></div></div>
<div class="dots">${Q.map((_,k)=>`<span class="${pick[k]!==null?(Q[k].o[pick[k]]===Q[k].a?'a':'w2'):''} ${k==i?'c':''}" onclick="i=${k};render()">${k+1}</span>`).join('')}</div>
<div class="row"><button class="b or" onclick="finish()">Nəticəni göstər 🏁</button></div>`}
function ans(k){if(pick[i]!==null)return;pick[i]=k;Q[i].o[k]===Q[i].a?good():bad();render()}
function showHint(){hint[i]=true;$('#h').style.display='block'}
function go(d){i=Math.max(0,Math.min(Q.length-1,i+d));render()}
function finish(){
const un=pick.filter(v=>v===null).length;
let ok=0,errs=[];Q.forEach((x,k)=>{if(pick[k]===null)errs.push({k,u:1});else if(x.o[pick[k]]===x.a)ok++;else errs.push({k,w:x.o[pick[k]]})});
const pc=Math.round(ok/Q.length*100),em=pc>=85?'👑🎃':pc>=60?'🧙‍♀️':pc>=40?'🦇':'💀';
(pc>=60?good:bad)();
$('#app').innerHTML=`<div class="card"><div class="big">${em}</div><h1>${ok} / ${Q.length} (${pc}%)</h1><p style="text-align:center;color:var(--mut)">Səhv: ${errs.filter(e=>e.w).length} · Cavabsız: ${un} · İpucu istifadəsi: ${hint.filter(Boolean).length}</p></div>
${errs.length?'<h2 style="color:var(--or)">Səhvlər 👻</h2>':'<p style="text-align:center">Heç bir səhv yoxdur! 🎉</p>'}
${errs.map(e=>`<div class="err"><b>${e.k+1}. ${Q[e.k].q}</b>${e.w?`<small>❌ Sənin cavabın: ${e.w}</small>`:'<small>⚠️ Cavablanmayıb</small>'}<small style="color:var(--ok)">✅ Düzgün: ${Q[e.k].a}</small></div>`).join('')}
<div class="row"><button class="b or" onclick="pick.fill(null);hint.fill(false);i=0;render()">Yenidən başla 🔄</button><button class="b g" onclick="i=0;render()">Suallara bax</button></div>`}
render();
</script></body></html>
