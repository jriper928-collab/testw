<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İmtahan Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-deep: #c2185b;
    --pink-main: #e91e8c;
    --pink-mid: #f06292;
    --pink-light: #f8bbd9;
    --pink-pale: #fce4ec;
    --pink-soft: #fff0f6;
    --white: #ffffff;
    --text-dark: #3a0020;
    --text-mid: #7b1a4b;
    --correct: #2e7d32;
    --correct-bg: #e8f5e9;
    --wrong: #c62828;
    --wrong-bg: #ffebee;
    --shadow: 0 8px 32px rgba(194,24,91,0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fff0f6 40%, #f8bbd9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(233,30,140,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(194,24,91,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    color: var(--pink-deep);
    letter-spacing: -0.5px;
    text-shadow: 0 2px 12px rgba(194,24,91,0.12);
  }
  .header p {
    color: var(--text-mid);
    font-size: 1rem;
    margin-top: 6px;
    font-weight: 500;
  }

  /* CARD */
  .card {
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow), 0 2px 0 var(--pink-light);
    padding: 36px 40px 28px;
    border: 1.5px solid var(--pink-light);
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--pink-pale);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-main), var(--pink-deep));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 0.85rem;
    color: var(--text-mid);
    font-weight: 700;
    white-space: nowrap;
  }

  /* QUESTION */
  .question-number {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--pink-main);
    margin-bottom: 10px;
  }
  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.22rem;
    color: var(--text-dark);
    line-height: 1.6;
    margin-bottom: 26px;
    min-height: 60px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 2px solid var(--pink-light);
    border-radius: 14px;
    background: var(--pink-soft);
    color: var(--text-dark);
    font-family: 'Nunito', sans-serif;
    font-size: 0.97rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(233,30,140,0.06), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .option-btn:hover:not(:disabled)::before { opacity: 1; }
  .option-btn:hover:not(:disabled) {
    border-color: var(--pink-main);
    transform: translateX(4px);
    box-shadow: 0 4px 14px rgba(233,30,140,0.13);
  }
  .option-btn:disabled { cursor: not-allowed; }
  .option-letter {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 50%;
    background: var(--pink-light);
    color: var(--pink-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
  }
  .option-btn.correct .option-letter {
    background: var(--correct);
    color: #fff;
  }
  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .option-btn.wrong .option-letter {
    background: var(--wrong);
    color: #fff;
  }

  /* HINT */
  .hint-section {
    margin-bottom: 22px;
  }
  .hint-toggle {
    background: none;
    border: 1.5px dashed var(--pink-mid);
    color: var(--pink-deep);
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 99px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.2s;
  }
  .hint-toggle:hover {
    background: var(--pink-pale);
    border-color: var(--pink-deep);
  }
  .hint-icon { font-size: 1.1em; }
  .hint-box {
    display: none;
    margin-top: 10px;
    background: linear-gradient(135deg, var(--pink-pale), #fff);
    border: 1.5px solid var(--pink-light);
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text-mid);
    font-size: 0.92rem;
    line-height: 1.55;
    animation: fadeIn 0.3s ease;
  }
  .hint-box.visible { display: block; }

  /* FEEDBACK */
  .feedback {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }
  .feedback.show { display: flex; }
  .feedback.correct-fb { background: var(--correct-bg); color: var(--correct); }
  .feedback.wrong-fb { background: var(--wrong-bg); color: var(--wrong); }

  /* NAV */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  .nav-btn {
    padding: 11px 26px;
    border-radius: 99px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .btn-prev {
    background: var(--pink-pale);
    color: var(--pink-deep);
  }
  .btn-prev:hover { background: var(--pink-light); }
  .btn-next {
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    color: #fff;
    box-shadow: 0 4px 14px rgba(194,24,91,0.28);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(194,24,91,0.35); }
  .btn-next:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .score-pill {
    background: var(--pink-pale);
    color: var(--pink-deep);
    border-radius: 99px;
    padding: 7px 18px;
    font-weight: 800;
    font-size: 0.92rem;
    border: 1.5px solid var(--pink-light);
  }

  /* RESULT */
  .result-card {
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 40px 40px 36px;
    border: 1.5px solid var(--pink-light);
    animation: fadeIn 0.5s ease;
  }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--pink-deep);
    text-align: center;
    margin-bottom: 6px;
  }
  .result-score {
    text-align: center;
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--pink-main);
    line-height: 1;
    margin: 18px 0 6px;
  }
  .result-sub {
    text-align: center;
    color: var(--text-mid);
    font-size: 1rem;
    margin-bottom: 28px;
  }
  .wrong-list-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--text-dark);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--pink-light);
  }
  .wrong-item {
    background: var(--pink-soft);
    border: 1.5px solid var(--pink-light);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .wrong-item-q {
    font-weight: 700;
    color: var(--text-dark);
    font-size: 0.93rem;
    margin-bottom: 6px;
    line-height: 1.45;
  }
  .wrong-item-q span {
    color: var(--pink-deep);
    font-family: 'Playfair Display', serif;
  }
  .wrong-item-a {
    font-size: 0.9rem;
    color: var(--correct);
    font-weight: 700;
  }
  .wrong-item-a::before { content: '✓ Doğru cavab: '; }
  .restart-btn {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(194,24,91,0.28);
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(194,24,91,0.35); }

  .emoji-big { font-size: 3rem; display: block; text-align: center; margin-bottom: 8px; }

  @media (max-width: 600px) {
    .card, .result-card { padding: 24px 18px 20px; }
    .header h1 { font-size: 1.7rem; }
    .question-text { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌸 Kompüter Bilikləri Quiz</h1>
    <p>İmtahan sualları — 60 sual</p>
  </div>

  <div id="quiz-area"></div>
</div>

<script>
const allQuestions = [
  {q:"Ana lövhə (ana plata) nə üçündür?",a:"Bütün komponentləri bir-birinə bağlayır və aralarında məlumat mübadiləsini təmin edir",hint:"Kompüterin əsas dövrə lövhəsidir; prosessor, RAM, kart, portları birləşdirir.",wrongs:["Yalnız elektrik enerjisini paylaşdırır","Fayl saxlama üçün istifadə olunur","İnternetə qoşulmaq üçün nəzərdə tutulmuşdur"]},
  {q:"Ana lövhə üzərində hansı vacib qurğular yerləşir?",a:"Prosessor yuvası, RAM yuvaları, genişlənmə slotları, BIOS çipi, körpülər",hint:"Soket, DIMM slotları, PCI/AGP, BIOS ROM, Şimal/Cənub körpüsü sayıla bilər.",wrongs:["Yalnız sabit disk və CD-ROM","Monitor, klaviatura, siçan","Güc mənbəyi, batareya, fan"]},
  {q:"Prosessor nə ilə soyudulur?",a:"Üzərinə qoyulan soyuducu (heatsink) və fan ilə soyudulur",hint:"Prosessor xüsusi soketdə yerləşir; istilik soyuducu vasitəsilə aparılır.",wrongs:["Su ilə doldurulmuş xüsusi rezervuar","Termal pasta tək başına kifayət edir","Heç bir soyutmaya ehtiyac yoxdur"]},
  {q:"Keş yaddaş nədir?",a:"Prosessorun çox tez-tez istifadə etdiyi məlumatları müvəqqəti saxlayan, RAM-dan daha sürətli yaddaş",hint:"L1, L2, L3 keş SRAM əsasında qurulur.",wrongs:["İnternetdən yüklənmiş fayllar saxlanılan yer","Əməliyyat sisteminin yükləndiyi sahə","Daimi məlumat saxlanılan disk hissəsi"]},
  {q:"RAM harada yerləşdirilir?",a:"Ana lövhə üzərindəki DIMM yuvalarına yerləşdirilir",hint:"DIMM — Dual Inline Memory Module deməkdir.",wrongs:["Prosessorun içinə yerləşdirilir","Sabit diskin üzərinə qoşulur","Güc mənbəyinə birləşdirilir"]},
  {q:"Genişlənmə kartları haraya qoşulur?",a:"Ana lövhə üzərindəki PCI, PCI-E və ya AGP slotlarına qoşulur",hint:"Videokart, səs kartı, şəbəkə kartı bu slotlara taxılır.",wrongs:["USB portuna qoşulur","SATA kabeli ilə birləşdirilir","RAM yuvalarına taxılır"]},
  {q:"BIOS nədir?",a:"Ana lövhənin ROM çipinə yazılmış proqramdır; avadanlıqları yoxlayır və əməliyyat sistemini yükləyir",hint:"POST (Power-On Self Test) prosedurunu BIOS yerinə yetirir.",wrongs:["İnternetdən yüklənən əməliyyat sistemi","RAM-da saxlanan müvəqqəti proqram","Microsoft tərəfindən hazırlanmış antivirus"]},
  {q:"Ana lövhədəki şin (bus) nə üçündür?",a:"Kompüterin müxtəlif komponentləri arasında məlumat, ünvan və idarəetmə siqnallarını ötürmək üçün",hint:"Şin üç növdür: məlumat, ünvan, idarəetmə.",wrongs:["Yalnız elektrik cərəyanını ötürmək üçün","Kompüteri internetə qoşmaq üçün","Faylları şifrələmək üçün"]},
  {q:"Şinlərin növləri hansılardır?",a:"Məlumat şini (data bus), ünvan şini (address bus) və idarəetmə şini (control bus)",hint:"Hər şin fərqli tip siqnal daşıyır.",wrongs:["Giriş, çıxış, elektrik şinləri","USB, SATA, HDMI şinləri","Optik, elektrik, radio şinləri"]},
  {q:"Şimal körpüsü hansı məlumatları idarə edir?",a:"Prosessor, RAM və videokart (AGP/PCI-E) arasındakı yüksək sürətli məlumat mübadiləsini",hint:"Yüksək sürətli komponentlər Şimal körpüsünə bağlıdır.",wrongs:["USB və klaviatura trafikini","SATA disk məlumatlarını","Yalnız BIOS siqnallarını"]},
  {q:"Cənub körpüsü hansı qurğulara nəzarət edir?",a:"USB, SATA, PCI, ses kartı, BIOS, klaviatura/siçan kimi yavaş periferiya qurğularına",hint:"Daha aşağı sürətli I/O qurğuları Cənub körpüsünə qoşulur.",wrongs:["RAM və prosessora","Videokart və AGP slotuna","Yalnız şəbəkə kartına"]},
  {q:"Körpülər niyə soyudulur?",a:"Çox məlumat emal etdiklərindən istilik hasil edirlər; həddindən artıq qızma sistemin zədələnməsinə səbəb olur",hint:"Körpülər üzərində çox vaxt kiçik radiatörlar olur.",wrongs:["Estetik görünmək üçün","Elektrik sərfini azaltmaq üçün","Siqnalları güclənndirmək üçün"]},
  {q:"Arxa panel portları hansılardır?",a:"USB, HDMI, VGA, Audio (3.5mm), Ethernet (RJ-45), PS/2 portları",hint:"Xarici qurğuları kompüterə qoşmaq üçün istifadə olunur.",wrongs:["Yalnız USB portları","SATA, M.2, PCIe portları","RAM, CPU, GPU yuvaları"]},
  {q:"PS/2 portu nə üçün istifadə olunur?",a:"Köhnə tip klaviatura və siçanı ana lövhəyə qoşmaq üçün (yaşıl — siçan, bənövşəyi — klaviatura)",hint:"PS/2 USB-dən əvvəl geniş yayılmışdı.",wrongs:["Monitor qoşmaq üçün","İnternetə bağlanmaq üçün","Printer qoşmaq üçün"]},
  {q:"ISA slotu nə üçündür?",a:"Köhnə genişlənmə kartlarını qoşmaq üçündür; 8 və ya 16 bitlik köhnə texnologiyadır",hint:"Müasir ana lövhələrdə artıq ISA slotu yoxdur.",wrongs:["Yüksək sürətli videokartlar üçün","DDR5 RAM yuvası növüdür","USB 3.0 alternatividir"]},
  {q:"PCI slotunun əsas üstünlüyü nədir?",a:"ISA-dan çox sürətlidir (32/64 bit), müxtəlif kartları dəstəkləyir və 'Plug and Play' texnologiyasını dəstəkləyir",hint:"Şəbəkə, səs, TV tuner kartları PCI-yə taxılırdı.",wrongs:["Yalnız videokart üçündür","ISA-dan 2 dəfə yavaşdır","Yalnız 8 bit məlumat ötürür"]},
  {q:"AGP portu hansı qurğu üçün nəzərdə tutulmuşdur?",a:"Yalnız videokart üçün nəzərdə tutulmuşdur",hint:"AGP — Accelerated Graphics Port deməkdir.",wrongs:["Sabit disk qoşmaq üçün","Səs kartı üçün","Şəbəkə kartı üçün"]},
  {q:"DDR yaddaş nədir?",a:"Hər takt tsiklində həm yüksəliş, həm eniş zamanı məlumat ötürərək SDR-dən iki dəfə sürətli işləyən RAM növü",hint:"DDR — Double Data Rate deməkdir.",wrongs:["Yalnız serverlərdə istifadə olunan RAM növü","Daimi yaddaş növü, söndürüldükdə silinmir","Prosessorun daxilindəki keş yaddaşın adı"]},
  {q:"Ana lövhə batareyasının funksiyası nədir?",a:"Kompüter söndürüldükdə BIOS parametrlərini (tarix, saat, hardware ayarları) saxlamaq üçün",hint:"CR2032 tipli kiçik düymə batareyadır.",wrongs:["Kompüteri elektriksiz işlətmək üçün","RAM-ı daimi saxlamaq üçün","İnternetə simsiz qoşulmaq üçün"]},
  {q:"Mikroprosessor nə üçün istifadə olunur?",a:"Kompüterin 'beyni' kimi funksiya görür; hesablamalar aparır, proqram əmrlərini icra edir",hint:"CPU əsas emal mərkəzidir.",wrongs:["Məlumatları saxlamaq üçün","Şəkilləri göstərmək üçün","İnternetə qoşulmaq üçün"]},
  {q:"CPU nə deməkdir?",a:"Central Processing Unit — Mərkəzi Emal Qurğusu",hint:"Kompüterin əsas emal vahididir.",wrongs:["Computer Power Unit","Central Program Utility","Core Processing Unit"]},
  {q:"Mikroprosessor harada istifadə olunur?",a:"Kompüterlər, smartfonlar, planşetlər, avtomobillər, sənaye avadanlıqları, məişət elektronikasında",hint:"Demək olar ki, bütün 'ağıllı' cihazlarda prosessor var.",wrongs:["Yalnız masa üstü kompüterlərdə","Yalnız hərbi avadanlıqlarda","Yalnız oyun konsollarında"]},
  {q:"Mərkəzi Əməliyyat Bloku (MƏB) neçə hissədən ibarətdir?",a:"3 əsas hissədən: Hesab-Məntiq Qurğusu (HMQ), İdarəetmə Qurğusu (İQ) və Registrlər",hint:"Bu 3 hissə birlikdə CPU-nun əsasını təşkil edir.",wrongs:["2 hissə: giriş və çıxış","5 hissə: HMQ, IQ, RAM, ROM, BUS","4 hissə: keş, şin, soket, slot"]},
  {q:"Registrlər nədir?",a:"Prosessorun daxilindəki çox kiçik, son dərəcə sürətli yaddaş hüceyrələri; cari hesablamalarda məlumat saxlayır",hint:"Registrlər RAM-dan, keşdən də sürətlidir.",wrongs:["Prosessorun xarici yaddaşıdır","Sabit diskdəki xüsusi bölmələrdir","Ana lövhədəki enerjisaxlama elementləridir"]},
  {q:"Yaddaş Ünvan Registri (MAR) nəyi saxlayır?",a:"Prosessorun RAM-a müraciət etmək istədiyi yaddaş xanasının ünvanını (adresini)",hint:"MAR — Memory Address Register.",wrongs:["RAM-dan oxunan məlumatı","Hesablamaların nəticəsini","Proqramın icra olunan son əmrini"]},
  {q:"Yaddaş Verilənlər Registri (MDR) nəyi saxlayır?",a:"RAM-dan oxunan və ya RAM-a yazılacaq olan məlumatı müvəqqəti saxlayır",hint:"MDR — Memory Data Register.",wrongs:["RAM-a müraciət ünvanını","Proqram sayğacının dəyərini","İdarəetmə siqnallarını"]},
  {q:"Hesab-Məntiq Qurğusu (HMQ) hansı funksiyanı yerinə yetirir?",a:"Riyazi əməliyyatları (toplama, çıxma, vurma, bölmə) və məntiqi əməliyyatları (AND, OR, NOT) yerinə yetirir",hint:"ALU — Arithmetic Logic Unit.",wrongs:["Proqram əmrlərini RAM-a yazır","Əməliyyat sistemini yükləyir","Yaddaş ünvanlarını idarə edir"]},
  {q:"İnterfeys Qurğusunun vəzifəsi nədir?",a:"Prosessor ilə xarici qurğular (giriş/çıxış cihazları) arasında məlumat mübadiləsini təmin edir",hint:"I/O interfeysi prosessor ilə periferiya arasında körpü rolunu oynayır.",wrongs:["Prosessor ilə RAM arasında sürəti artırır","Batareyanı idarə edir","BIOS-u yeniləyir"]},

  {q:"İlk mikroprosessor hansıdır?",a:"1971-ci ildə Intel şirkəti tərəfindən hazırlanmış Intel 4004",hint:"Intel 4004 — 4 bitlik idi.",wrongs:["1965-ci ildə AMD tərəfindən hazırlanmış AMD 1000","1980-ci ildə IBM tərəfindən hazırlanmış IBM 8080","1969-cu ildə Motorola tərəfindən hazırlanmış M6800"]},
  {q:"Keş yaddaş nə üçün istifadə olunur?",a:"Prosessorun tez-tez ehtiyac duyduğu məlumatları RAM-a müraciət etmədən çox sürətli şəkildə vermək üçün",hint:"Keş L1, L2, L3 kimi səviyyələrə bölünür.",wrongs:["Kompüterin şifrəsini saxlamaq üçün","İnternetdən yüklənmiş fayllar üçün","Əməliyyat sisteminin parametrləri üçün"]},
  {q:"Müasir prosessorlar neçə bit olur?",a:"Müasir prosessorlar əsasən 64 bitlikdir",hint:"64 bit — 2^64 qədər ünvana müraciət edə bilir.",wrongs:["32 bitlikdir","128 bitlikdir","16 bitlikdir"]},
  {q:"Takt tezliyi nəyi göstərir?",a:"Prosessorun bir saniyədə neçə əməliyyat (tsikl) icra edə biləcəyini; GHz vahidi ilə ölçülür",hint:"3 GHz = 3 milyard tsikl/saniyə.",wrongs:["RAM-ın ötürmə sürətini","Sabit diskin fırlanma sürətini","Monitorun şəkil yeniləmə sürətini"]},
  {q:"Əməli yaddaş (RAM) nə üçündür?",a:"Hal-hazırda işləyən proqramları, açıq faylları və əməliyyat sistemini müvəqqəti saxlamaq üçün",hint:"RAM müvəqqətidir — söndürüldükdə silinir.",wrongs:["Faylları daimi saxlamaq üçün","Videonu göstərmək üçün","İnternetə qoşulmaq üçün"]},
  {q:"Əməli yaddaş ilə daimi yaddaşın fərqi nədir?",a:"RAM müvəqqətidir (söndürüldükdə silinir) və sürətlidir; HDD/SSD daimi lakin daha yavaşdır",hint:"RAM — volatile, HDD/SSD — non-volatile yaddaş.",wrongs:["RAM daha yavaş, HDD daha sürətlidir","Fərq yoxdur, ikisi eyni işi görür","RAM daimi, HDD müvəqqətidir"]},
  {q:"Kompüter söndürüldükdə RAM-da olan məlumatlara nə olur?",a:"Silinir, çünki RAM uçucu (volatile) yaddaşdır",hint:"Elektrik olmadan RAM məlumatları saxlaya bilmir.",wrongs:["Avtomatik olaraq sabit diskə köçürülür","Bulud yaddaşına göndərilir","Heç nə olmur, məlumatlar qalır"]},
  {q:"Əməli yaddaş hansı növlərə bölünür?",a:"SRAM (Static RAM) və DRAM (Dynamic RAM)",hint:"SRAM sürətli amma bahalı; DRAM ucuz amma yenilənmə tələb edir.",wrongs:["DDR və SDR yalnız","ROM və RAM","Optik RAM və Maqnit RAM"]},
  {q:"SRAM-ın üstünlüyü nədir?",a:"DRAM-dan çox sürətlidir, davamlı yenilənməyə ehtiyac yoxdur; keş yaddaş kimi istifadə olunur",hint:"L1, L2, L3 keşlər SRAM-dır.",wrongs:["Ucuzdur və daha çox tutuma malikdir","Söndürüldükdə məlumatları saxlayır","USB ilə qoşulur"]},
  {q:"DRAM-ın hansı xüsusiyyətləri var?",a:"Ucuz və sıx yerləşdirilə bilir; məlumatları saxlamaq üçün davamlı elektrik yeniləməsi (refresh) tələb edir",hint:"Əsas sistem RAM-ı DRAM-dır.",wrongs:["Çox bahalı, yalnız serverdə istifadə olunur","Yenilənməyə ehtiyac yoxdur","Yalnız keş yaddaş olaraq istifadə olunur"]},
  {q:"RAM necə işləyir?",a:"Prosessor RAM-a ünvan göndərir, RAM həmin ünvandakı məlumatı oxuyub qaytarır; nanosaniyələr ərzində baş verir",hint:"Oxuma və yazma əməliyyatları ünvan vasitəsilə icra olunur.",wrongs:["RAM məlumatları fırlandırıcı disklərə yazır","RAM yalnız enerji saxlayır, məlumat saxlamır","RAM birbaşa monitora məlumat göndərir"]},
  {q:"Proqramlar niyə RAM-a köçürülür?",a:"Çünki RAM, HDD/SSD-dən onlarla dəfə sürətlidir; prosessor proqram əmrlərinə çox tez çatmaq üçün",hint:"Diskdən birbaşa çalışdırmaq çox yavaş olardı.",wrongs:["Çünki HDD çox istilik hasil edir","Çünki proqramlar diskin formatını dəstəkləmir","Çünki RAM sabit diskdən daha böyük tutuma malikdir"]},
  {q:"SPD çipi nə üçündür?",a:"RAM modulunun üzərindəki kiçik çipdir; RAM-ın sürəti, gərginliyi, ölçüsü haqqında məlumatları saxlayır ki, BIOS onu tanısın",hint:"SPD — Serial Presence Detect.",wrongs:["RAM-ı fiziki zədələrdən qoruyan örtükdür","RAM-ın içindəki əsas emal çipidir","RAM-ın temperaturunu ölçən sensorudur"]},
  {q:"RAM-da 'latency' (gecikmə) nə deməkdir?",a:"RAM-ın sorğu alandan məlumatı göndərməyə başlayana qədər keçən gecikmə müddəti; daha aşağı daha yaxşıdır",hint:"CL (CAS Latency) ən tanınmış gecikmədir.",wrongs:["RAM-ın bir saniyədə ötürdüyü maksimum məlumat miqdarı","RAM-ın söndürülməsindən yenidən başlamasına qədər keçən vaxt","RAM tutumunun bir hissəsinin sistem üçün ayrılması"]},
  {q:"'Access time' nəyi göstərir?",a:"RAM-a sorğu göndərilməsindən məlumatın tam alınmasına qədər keçən ümumi vaxt",hint:"Access time = latency + ötürmə müddəti.",wrongs:["Kompüterin bir gündə işlədiyi ortalama vaxt","RAM-ın ömür müddəti","İstifadəçinin RAM-ı sonuncu dəfə istifadə etdiyi vaxt"]},
  {q:"'Access time' hansı vahidlə ölçülür?",a:"Nanosaniyə (ns) vahidi ilə ölçülür",hint:"1 ns = 0.000000001 saniyə.",wrongs:["Millisaniyə (ms)","Mikrosaniyə (μs)","Saniyə (s)"]},
  {q:"DIMM nə üçündür?",a:"RAM çiplərinin yerləşdirildiyi lövhəcikdir; ana lövhənin RAM yuvalarına taxılaraq sistem yaddaşını artırır",hint:"DIMM — Dual Inline Memory Module.",wrongs:["Prosessorun üstünə qoyulan soyutma cihazıdır","Ana lövhənin güc giriş yuvası adıdır","Sabit diskin qoşulduğu konnektordur"]},
  {q:"Virtual yaddaş nə üçündür?",a:"RAM dolduqda əlavə yaddaş sahəsi kimi istifadə olunur; sabit diskdə xüsusi bir bölmə (page file/swap) kimi yaradılır",hint:"Virtual yaddaş RAM-dan çox yavaşdır.",wrongs:["İnternetdə saxlanılan buluq yaddaş növüdür","Prosessorun keş yaddaşının başqa adıdır","Əməliyyat sisteminin özünün istifadə etdiyi gizli RAM-dır"]},
  {q:"Windows 10 nədir?",a:"Microsoft tərəfindən hazırlanmış əməliyyat sistemidir; masa üstü kompüterlər, noutbuklar, planşetlər üçün nəzərdə tutulmuşdur",hint:"2015-ci ildə buraxılmışdır.",wrongs:["Apple tərəfindən hazırlanmış əməliyyat sistemidir","Yalnız smartfonlar üçün nəzərdə tutulmuş sistemdir","Google tərəfindən inkişaf etdirilmiş açıq mənbəli sistemdir"]},
  {q:"Cortana nədir?",a:"Windows 10-un daxili süni intellekt əsaslı səsli köməkçisidir; axtarış, xatırlatma, sistem idarəetməsi üçün",hint:"Siri və Google Assistant kimi səsli köməkçidir.",wrongs:["Windows 10-un fayl axtarış motorudur","Kompüterin antivirus proqramıdır","Windows-un rəsm çəkmə tətbiqidir"]},
  {q:"Əməliyyat sisteminin əsas vəzifələri hansılardır?",a:"Avadanlıq resurslarını idarə etmək, istifadəçi interfeysi təmin etmək, proqramların işləməsini təşkil etmək, fayl sistemini idarə etmək",hint:"OS hardware ilə software arasında körpüdür.",wrongs:["Yalnız internet bağlantısını idarə edir","Yalnız faylları saxlayır","Yalnız proqramları yükləyir"]},
  {q:"Windows 10 Home versiyası nə üçündür?",a:"Ev istifadəçiləri üçün; əsas funksiyaları (internet, media, oyun) özündə birləşdirir, lakin korporativ xüsusiyyətlər məhduddur",hint:"BitLocker, Group Policy Home-da yoxdur.",wrongs:["Yalnız biznes istifadəçiləri üçündür","Serverlər üçün optimallaşdırılmışdır","Bütün Pro xüsusiyyətlərini ehtiva edir"]},
  {q:"Fayl adında qadağan olunmuş simvollar hansılardır?",a:"Fayl adında istifadə edilə bilməyən simvollar: \\ / : * ? \" < > |",hint:"Bu simvollar sistemi çaşdıra bilər.",wrongs:["@ # $ % ^ & ( ) simvolları qadağandır","Yalnız boşluq simvolu qadağandır","Bütün xüsusi simvollar qadağandır"]},
  {q:"Qısayol (shortcut) nədir?",a:"Proqram, fayl və ya qovluğa tez çatmaq üçün yaradılan keçid ikonasıdır; orijinal faylı köçürmür",hint:"Qısayol silinəndə orijinal fayl qalmağa davam edir.",wrongs:["Orijinal faylın eynisidir, tam kopyasıdır","Faylı şifrələmək üçün istifadə olunan xüsusi tipdir","Həmişə masa üstündə yerləşdirilməlidir"]},
  {q:"Windows 10-da Desktop (İş masası) nə üçündür?",a:"Kompüter açıldıqdan sonra görünən əsas iş sahəsidir; proqram ikonları, qısayollar, fayllar üzərindən tez işə başlamaq üçün",hint:"Taskbar (vəzifə paneli) Desktop-un aşağı hissəsindədir.",wrongs:["Yalnız oyun oynamaq üçün nəzərdə tutulmuşdur","İnternetdən yüklənmiş faylların avtomatik saxlandığı yerdir","Əməliyyat sisteminin gizli idarəetmə panelidir"]},
  {q:"Desktop üzərində yerləşən əsas obyektlər hansılardır?",a:"Bu PC, Recycle Bin (Zibil qutusu), proqram qısayolları, qovluqlar, fayllar və Taskbar",hint:"Masa üstündə lazımsız ikonlar olmamalıdır.",wrongs:["Yalnız antivirus proqramı ikonası","BIOS parametrləri və sistem qovluqları","Yalnız internet brauzeri ikonu"]},
  {q:"Computer (Bu PC) qovluğunda nələr yerləşir?",a:"Sabit disklər (C:, D:), çıxarıla bilən disklər (USB, DVD), şəbəkə sürücüləri və digər yaddaş qurğuları",hint:"Bütün yaddaş qurğularına buradan çatmaq olur.",wrongs:["Yalnız C: sürücüsü","Yüklənmiş proqramların siyahısı","Şəbəkə parollarının siyahısı"]},
  {q:"Control Panel qovluğunun funksiyası nədir?",a:"Sistemin əsas parametrlərini (şəbəkə, avadanlıq, istifadəçilər, ekran, proqramların qaldırılması) idarə etmək üçün",hint:"İdarə Paneli sistemin mərkəzi konfiqurasiya yeridir.",wrongs:["Yalnız printer parametrlərini idarə edir","İnternetdən proqram yükləmək üçündür","Oyun sürücülərini yeniləmək üçündür"]},
];

let current = 0;
let answers = new Array(allQuestions.length).fill(null);
let shuffledOptions = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildOptions(q) {
  const opts = shuffle([q.a, ...q.wrongs]);
  return opts;
}

function initShuffled() {
  shuffledOptions = allQuestions.map(q => buildOptions(q));
}

function playSound(correct) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (correct) {
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f;
      o.type = 'sine';
      g.gain.setValueAtTime(0.18, ctx.currentTime + i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.3);
      o.start(ctx.currentTime + i*0.12);
      o.stop(ctx.currentTime + i*0.12 + 0.35);
    });
  } else {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.45);
  }
}

function renderQuestion() {
  const q = allQuestions[current];
  const opts = shuffledOptions[current];
  const chosen = answers[current];
  const pct = Math.round((current / allQuestions.length) * 100);
  const correct = answers.filter(a => a === true).length;

  const area = document.getElementById('quiz-area');
  area.innerHTML = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${current+1} / ${allQuestions.length}</div>
      </div>
      <div class="question-number">Sual ${current+1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options-list"></div>
      <div class="feedback ${chosen===true?'correct-fb show':chosen===false?'wrong-fb show':''}" id="feedback-box">
        ${chosen===true?'✅ Təbrik edirik! Düzgün cavab!':chosen===false?'❌ Səhv cavab!':''}
      </div>
      <div class="hint-section">
        <button class="hint-toggle" onclick="toggleHint()"><span class="hint-icon">💡</span> İpucu göstər</button>
        <div class="hint-box" id="hint-box">${q.hint}</div>
      </div>
      <div class="nav">
        <button class="nav-btn btn-prev" onclick="goTo(${current-1})" ${current===0?'disabled':''}>← Əvvəl</button>
        <div class="score-pill">✓ ${correct} doğru</div>
        ${current < allQuestions.length-1
          ? `<button class="nav-btn btn-next" onclick="goTo(${current+1})">Sonra →</button>`
          : `<button class="nav-btn btn-next" onclick="showResult()">Nəticə 🎉</button>`}
      </div>
    </div>
  `;

  const list = document.getElementById('options-list');
  const letters = ['A','B','C','D'];
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    let cls = '';
    if (chosen !== null) {
      if (opt === q.a) cls = 'correct';
      else if (chosen !== null && opt === opts[answers[current] === false ? opts.indexOf(opt) : -1]) cls = '';
    }
    // highlight selected wrong
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
    if (chosen !== null) {
      btn.disabled = true;
      if (opt === q.a) btn.classList.add('correct');
    }
    btn.addEventListener('click', () => selectAnswer(i, opt));
    list.appendChild(btn);
  });
}

function selectAnswer(idx, opt) {
  const q = allQuestions[current];
  const isCorrect = opt === q.a;
  answers[current] = isCorrect;
  playSound(isCorrect);

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (shuffledOptions[current][i] === q.a) b.classList.add('correct');
    else if (i === idx && !isCorrect) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback-box');
  fb.className = `feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = isCorrect ? '✅ Təbrik edirik! Düzgün cavab!' : '❌ Səhv cavab!';

  // update score pill
  const correct = answers.filter(a => a === true).length;
  document.querySelector('.score-pill').textContent = `✓ ${correct} doğru`;
}

function toggleHint() {
  const box = document.getElementById('hint-box');
  box.classList.toggle('visible');
}

function goTo(idx) {
  if (idx < 0 || idx >= allQuestions.length) return;
  current = idx;
  renderQuestion();
}

function showResult() {
  const correct = answers.filter(a => a === true).length;
  const total = allQuestions.length;
  const pct = Math.round((correct / total) * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';
  let msg = pct >= 80 ? 'Əla nəticə!' : pct >= 50 ? 'Yaxşı nəticə!' : 'Daha çox çalışın!';

  const wrongItems = allQuestions.map((q, i) => {
    if (answers[i] !== true) return q;
    return null;
  }).filter(Boolean);

  const area = document.getElementById('quiz-area');
  area.innerHTML = `
    <div class="result-card">
      <span class="emoji-big">${emoji}</span>
      <div class="result-title">Quiz Tamamlandı!</div>
      <div class="result-score">${correct} / ${total}</div>
      <div class="result-sub">${msg} — Düzgün cavablar: <strong>${pct}%</strong></div>
      ${wrongItems.length > 0 ? `
        <div class="wrong-list-title">❌ Səhv cavabladığınız suallar (${wrongItems.length} sual)</div>
        ${wrongItems.map((q, i) => {
          const qIdx = allQuestions.indexOf(q) + 1;
          return `<div class="wrong-item">
            <div class="wrong-item-q"><span>Sual ${qIdx}:</span> ${q.q}</div>
            <div class="wrong-item-a">${q.a}</div>
          </div>`;
        }).join('')}
      ` : '<div style="text-align:center;color:#2e7d32;font-weight:800;font-size:1.1rem;padding:16px 0">🏆 Bütün sualları düzgün cavabladınız!</div>'}
      <button class="restart-btn" onclick="restartQuiz()">🔄 Yenidən başla</button>
    </div>
  `;
}

function restartQuiz() {
  answers = new Array(allQuestions.length).fill(null);
  current = 0;
  initShuffled();
  renderQuestion();
}

// Init
initShuffled();
renderQuestion();
</script>
</body>
</html>
