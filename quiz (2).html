<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İmtahana Hazırlıq</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;}
#app{max-width:760px;margin:0 auto;padding:20px 16px;}
.home-title{font-size:2.2rem;font-weight:800;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.home-sub{text-align:center;color:#64748b;margin-bottom:36px;font-size:.95rem;}
.sec-card{background:#111827;border:2px solid #1e293b;border-radius:16px;padding:22px 24px;margin-bottom:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:18px;}
.sec-card:hover{transform:translateY(-2px);}
.sec-icon{font-size:2rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#1e293b;flex-shrink:0;}
.sec-label{font-weight:700;font-size:1.1rem;margin-bottom:3px;}
.sec-sub{color:#64748b;font-size:.83rem;margin-bottom:6px;}
.sec-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;border:1px solid;}
.sec-arrow{color:#475569;font-size:1.4rem;}
/* quiz */
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{background:transparent;border:1px solid #1e293b;color:#94a3b8;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.85rem;transition:all .2s;white-space:nowrap;}
.back-btn:hover{border-color:#00d4ff;color:#00d4ff;}
.prog-track{flex:1;height:6px;background:#1e293b;border-radius:10px;overflow:hidden;}
.prog-bar{height:100%;border-radius:10px;transition:width .5s ease;}
.counter{color:#64748b;font-size:.85rem;white-space:nowrap;}
.q-card{background:#111827;border:2px solid #1e293b;border-radius:18px;padding:28px 24px;margin-bottom:18px;transition:border-color .3s;}
.q-num{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.q-text{font-size:1.1rem;font-weight:600;line-height:1.65;color:#f1f5f9;}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.opt{padding:14px 18px;border-radius:12px;border:2px solid #1e293b;background:#0f172a;cursor:pointer;font-size:.93rem;transition:all .18s;text-align:left;color:#cbd5e1;line-height:1.5;font-family:inherit;}
.opt:hover:not(.locked){background:#1e293b;}
.opt.correct{background:#0f2d1a!important;border-color:#166534!important;color:#4ade80!important;}
.opt.wrong{background:#2d0f0f!important;border-color:#7f1d1d!important;color:#f87171!important;}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.nav-btn{padding:12px 26px;border-radius:10px;border:none;font-size:.93rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;}
.hint-btn{padding:10px 16px;border-radius:10px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:.83rem;cursor:pointer;transition:all .2s;font-family:inherit;}
.hint-btn:hover{border-color:#00d4ff;color:#00d4ff;}
.hint-box{background:#0f2d1a;border:1px solid #166534;border-radius:10px;padding:12px 16px;margin-bottom:14px;color:#4ade80;font-size:.88rem;line-height:1.5;}
/* results */
.results{text-align:center;padding:40px 20px;}
.big-score{font-size:5rem;font-weight:900;line-height:1.1;margin:14px 0;}
.grade{font-size:1.6rem;font-weight:700;margin-bottom:24px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:20px 0;}
.stat-card{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:16px;}
.stat-num{font-size:1.8rem;font-weight:800;}
.stat-lbl{font-size:.75rem;color:#64748b;margin-top:4px;}
.res-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home">
    <div style="padding:40px 0 0">
      <div class="home-title">📶 İmtahana Hazırlıq</div>
      <div class="home-sub">NGN, ATM, IP Telefon, C&C08 · Bölmə seçin</div>
      <div id="sec-list"></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="top-bar">
      <button class="back-btn" onclick="goHome()">← Çıx</button>
      <div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>
      <div class="counter"><span id="q-cur" style="font-weight:700"></span>/<span id="q-tot"></span></div>
    </div>
    <div class="q-card" id="q-card">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="hint-box hidden" id="hint-box"></div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev" style="background:#1e293b;color:#94a3b8" onclick="goPrev()">← Geri</button>
      <button class="hint-btn" onclick="toggleHint()">💡 İpucu</button>
      <button class="nav-btn" id="btn-next" onclick="goNext()">İrəli →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="hidden results">
    <div style="font-size:3rem">🎓</div>
    <div style="font-size:1.4rem;font-weight:700;color:#f1f5f9;margin-top:8px">İmtahan Tamamlandı</div>
    <div class="big-score" id="res-score"></div>
    <div class="grade" id="res-grade"></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" style="color:#22c55e" id="res-ok"></div><div class="stat-lbl">Doğru</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#ef4444" id="res-wrong"></div><div class="stat-lbl">Səhv</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#94a3b8" id="res-total"></div><div class="stat-lbl">Cəmi</div></div>
    </div>
    <div class="res-btns">
      <button class="nav-btn" id="res-retry" onclick="retryQuiz()">🔄 Yenidən</button>
      <button class="nav-btn" style="background:#1e293b;color:#94a3b8" onclick="goHome()">🏠 Ana Səhifə</button>
    </div>
  </div>

</div>

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function playSound(ok){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(ok){o.type="sine";o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+0.12);o.frequency.setValueAtTime(784,ctx.currentTime+0.24);g.gain.setValueAtTime(0.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.45);}
    else{o.type="sawtooth";o.frequency.setValueAtTime(220,ctx.currentTime);o.frequency.linearRampToValueAtTime(110,ctx.currentTime+0.3);g.gain.setValueAtTime(0.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.35);}
  }catch(e){}
}

let state={section:null,questions:[],idx:0,answers:{},locked:false,hintVisible:false};

function processSection(raw){
  return raw.map(([q,correct,...wrongs])=>{
    const opts=shuffle([{t:correct,ok:true},...wrongs.map(w=>({t:w,ok:false}))]);
    return{q,opts:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),hint:correct};
  });
}

function show(id){['home','quiz','results'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));}

function buildHome(){
  const list=document.getElementById('sec-list');
  list.innerHTML=SECTION_META.map(s=>`
    <div class="sec-card" onclick="startQuiz('${s.key}')" style="--c:${s.color}"
      onmouseover="this.style.borderColor='${s.color}';this.style.background='#161f30';this.style.transform='translateY(-2px)'"
      onmouseout="this.style.borderColor='#1e293b';this.style.background='#111827';this.style.transform='none'">
      <div class="sec-icon">${s.icon}</div>
      <div class="sec-info" style="flex:1">
        <div class="sec-label" style="color:${s.color}">${s.label}</div>
        <div class="sec-sub">${s.sub}</div>
        <span class="sec-badge" style="color:${s.color};border-color:${s.color}55;background:${s.color}18">${s.count} sual</span>
      </div>
      <div style="color:#475569;font-size:1.4rem">›</div>
    </div>`).join('');
}

function startQuiz(key){
  state.section=key;
  state.questions=processSection(RAW[key]);
  state.idx=0;state.answers={};state.locked=false;state.hintVisible=false;
  renderQuiz();
  show('quiz');
}

function renderQuiz(){
  const{questions,idx,answers,locked,hintVisible}=state;
  const q=questions[idx];
  const meta=SECTION_META.find(m=>m.key===state.section);
  const color=meta.color;
  const total=questions.length;
  const answered=Object.keys(answers).length;

  document.getElementById('prog-bar').style.width=(answered/total*100)+'%';
  document.getElementById('prog-bar').style.background=`linear-gradient(90deg,${color},${color}aa)`;
  document.getElementById('q-cur').textContent=idx+1;
  document.getElementById('q-cur').style.color=color;
  document.getElementById('q-tot').textContent=total;
  document.getElementById('q-num').textContent=meta.label+' · Sual '+(idx+1);
  document.getElementById('q-num').style.color=color;
  document.getElementById('q-text').textContent=q.q;

  const isOk=answers[idx];
  const card=document.getElementById('q-card');
  card.style.borderColor=locked?(isOk?'#166534':'#7f1d1d'):'#1e293b';

  const hintBox=document.getElementById('hint-box');
  hintBox.classList.toggle('hidden',!hintVisible);
  if(hintVisible)hintBox.innerHTML='💡 <strong>İpucu:</strong> '+q.hint;

  const optsEl=document.getElementById('opts');
  optsEl.innerHTML=q.opts.map((opt,i)=>{
    let cls='opt';
    if(locked){if(i===q.correct)cls+=' correct';else if(answers[idx]===false&&i!==q.correct&&state.selectedIdx===i)cls+=' wrong';}
    return`<button class="${cls}" onclick="selectOpt(${i})" style="cursor:${locked?'default':'pointer'}">`+
      `<span style="margin-right:8px;opacity:.5;font-weight:700">${'ABCD'[i]}.</span>${opt}</button>`;
  }).join('');

  document.getElementById('btn-prev').style.opacity=idx===0?'0.3':'1';
  document.getElementById('btn-prev').style.cursor=idx===0?'not-allowed':'pointer';
  document.getElementById('btn-next').textContent=idx<total-1?'İrəli →':'Nəticə 🏁';
  document.getElementById('btn-next').style.background=color;
}

function selectOpt(i){
  if(state.locked)return;
  const q=state.questions[state.idx];
  const isOk=i===q.correct;
  state.selectedIdx=i;
  state.locked=true;
  state.answers[state.idx]=isOk;
  playSound(isOk);
  renderQuiz();
}

function toggleHint(){
  state.hintVisible=!state.hintVisible;
  const btn=document.querySelector('.hint-btn');
  btn.textContent=state.hintVisible?'🙈 Gizlət':'💡 İpucu';
  const hintBox=document.getElementById('hint-box');
  hintBox.classList.toggle('hidden',!state.hintVisible);
  if(state.hintVisible)hintBox.innerHTML='💡 <strong>İpucu:</strong> '+state.questions[state.idx].hint;
}

function goPrev(){
  if(state.idx===0)return;
  state.idx--;
  const prevAns=state.answers[state.idx];
  state.locked=prevAns!==undefined;
  state.hintVisible=false;
  state.selectedIdx=undefined;
  renderQuiz();
}

function goNext(){
  if(state.idx<state.questions.length-1){
    state.idx++;
    const ans=state.answers[state.idx];
    state.locked=ans!==undefined;
    state.hintVisible=false;
    state.selectedIdx=undefined;
    renderQuiz();
  }else{showResults();}
}

function showResults(){
  const total=state.questions.length;
  const correct=Object.values(state.answers).filter(Boolean).length;
  const score=Math.round(correct/total*100);
  const grade=score>=90?'Əla! 🌟':score>=75?'Yaxşı 👍':score>=60?'Kafi ✔️':'Zəif ❌';
  const color=score>=90?'#22c55e':score>=75?'#00d4ff':score>=60?'#f59e0b':'#ef4444';
  const meta=SECTION_META.find(m=>m.key===state.section);
  document.getElementById('res-score').textContent=score+'%';
  document.getElementById('res-score').style.color=color;
  document.getElementById('res-grade').textContent=grade;
  document.getElementById('res-grade').style.color=color;
  document.getElementById('res-ok').textContent=correct;
  document.getElementById('res-wrong').textContent=total-correct;
  document.getElementById('res-total').textContent=total;
  document.getElementById('res-retry').style.background=meta.color;
  document.getElementById('res-retry').style.color='#000';
  show('results');
}

function retryQuiz(){startQuiz(state.section);}
function goHome(){show('home');}

buildHome();
show('home');
</script>
</body>
</html>
