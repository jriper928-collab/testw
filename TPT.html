<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cadılar Bayramı Testi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Spectral:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: one centered card on a moonlit haunted sky; question on top, 4 coffin-like options, nav bar + jump grid below */
:root{--bg:#0d0a14;--panel:#1a1226;--panel2:#241936;--ink:#eadfcf;--mute:#9a8fae;--pumpkin:#ff7a1a;--slime:#7bd13a;--blood:#e0344b;--line:#3a2a52;color-scheme:dark;
--display:'Creepster','Impact',cursive;--body:'Spectral',Georgia,serif;--util:'Special Elite','Courier New',monospace}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 80% -10%,#3b1d5e 0%,transparent 45%),radial-gradient(ellipse at 10% 110%,#3a1a08 0%,transparent 40%),var(--bg);color:var(--ink);font:17px/1.5 var(--body);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.moon{position:fixed;top:24px;right:6%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#e9d58a 60%,#b9a45c);box-shadow:0 0 60px 10px #e9d58a55;opacity:.55;pointer-events:none}
.bat{position:fixed;font-size:26px;pointer-events:none;opacity:.5;animation:fly 18s linear infinite;top:10%;left:-60px}
.bat:nth-of-type(2){top:30%;animation-duration:25s;animation-delay:-9s;font-size:20px}
.bat:nth-of-type(3){top:60%;animation-duration:31s;animation-delay:-18s}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(55vw,-40px)}100%{transform:translate(115vw,20px)}}
.wrap{max-width:760px;margin:0 auto;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font:400 clamp(34px,7vw,52px)/1 var(--display);color:var(--pumpkin);letter-spacing:.04em;margin:0;text-shadow:0 0 18px #ff7a1a66;text-wrap:balance}
.tools{display:flex;gap:8px;align-items:center;font:14px var(--util)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mute);padding:6px 10px;border-radius:6px;font:14px var(--util)}
.ghost:hover{border-color:var(--pumpkin);color:var(--pumpkin)}
:focus-visible{outline:2px solid var(--slime);outline-offset:2px}
.bar{height:8px;background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pumpkin),#ffb347);transition:width .4s}
.meta{display:flex;justify-content:space-between;font:14px var(--util);color:var(--mute);margin:8px 2px 14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,28px);box-shadow:0 20px 60px #000a}
.qn{font:14px var(--util);color:var(--slime);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.qt{font:600 clamp(19px,3.6vw,24px)/1.35 var(--body);margin:0 0 16px;text-wrap:balance}
.qimg{display:block;background:#fff;border-radius:8px;padding:8px;margin:0 0 16px;max-width:100%;height:auto;image-rendering:auto}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;background:#120c1d;border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.4;transition:transform .12s,border-color .12s,background .12s}
.opt b{font:400 18px/1.2 var(--display);color:var(--pumpkin);min-width:22px;padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--pumpkin);transform:translateX(4px);background:#1d1230}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--slime);background:#13260f;box-shadow:0 0 18px #7bd13a44}
.opt.ok b{color:var(--slime)}
.opt.bad{border-color:var(--blood);background:#2c0d14;animation:shake .4s}
.opt.bad b{color:var(--blood)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintrow{margin-top:16px}
.hintbtn{background:#2a1608;border:1px dashed var(--pumpkin);color:var(--pumpkin);padding:8px 14px;border-radius:8px;font:15px var(--util)}
.hintbtn:hover{background:#3a1e0a}
.hint{margin-top:10px;padding:12px 14px;border-left:3px solid var(--pumpkin);background:#1f130a;border-radius:0 8px 8px 0;font-style:italic}
.hint small{display:block;font:12px var(--util);color:var(--pumpkin);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-style:normal}
.verdict{margin-top:14px;font:400 26px var(--display);letter-spacing:.04em;min-height:1em}
.verdict.ok{color:var(--slime)}.verdict.bad{color:var(--blood)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.btn{background:var(--pumpkin);color:#1a0d02;border:0;border-radius:8px;padding:10px 18px;font:400 20px var(--display);letter-spacing:.05em}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--pumpkin);color:var(--pumpkin)}
.btn:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.dot{padding:6px 0;border-radius:6px;border:1px solid var(--line);background:#120c1d;font:13px var(--util);color:var(--mute)}
.dot.ok{background:#13260f;border-color:var(--slime);color:var(--slime)}
.dot.bad{background:#2c0d14;border-color:var(--blood);color:var(--blood)}
.dot.cur{outline:2px solid var(--pumpkin);outline-offset:1px;color:var(--ink)}
.score{font:400 clamp(64px,16vw,110px)/1 var(--display);color:var(--pumpkin);text-shadow:0 0 30px #ff7a1a77;margin:6px 0}
.rank{font:600 22px var(--body);margin-bottom:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font:15px var(--util);color:var(--mute);margin:10px 0 20px}
.stats b{color:var(--ink)}
.err{border:1px solid var(--line);border-left:3px solid var(--blood);border-radius:8px;background:#150d1f;padding:12px 14px;margin-top:12px}
.err h3{margin:0 0 8px;font:600 17px/1.35 var(--body)}
.err p{margin:4px 0;font-size:15px}
.err .y{color:var(--blood)}.err .c{color:var(--slime)}.err .e{color:var(--mute);font-style:italic}
.err img{max-height:70px;background:#fff;border-radius:4px;padding:3px;margin:4px 0}
.perfect{padding:16px;border:1px solid var(--slime);border-radius:10px;color:var(--slime);background:#10200c}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header><div></div><div class="tools"><button class="ghost" id="mute" aria-pressed="false">🔊 Səs: açıq</button></div></header>
<div id="app"></div>
</div>

const LET=["A","B","C","D"];
let S,muted=false,ac;
try{muted=localStorage.getItem('hw-mute')==='1'}catch(e){}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){S={i:0,items:Q.map(q=>{const o=shuffle([{t:q[2],c:1},...q[3].map(t=>({t,c:0}))]);return{o,pick:null,hint:false}}),done:false}}
/* sounds */
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type,vol,f2){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.05)}
function sndOk(){if(muted)return;[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.35,'triangle',.18));tone(2093,.4,.5,'sine',.06)}
function sndBad(){if(muted)return;tone(220,0,.7,'sawtooth',.2,55);tone(233,0,.7,'square',.1,50);tone(90,.1,.8,'sawtooth',.2,35);for(let i=0;i<6;i++)tone(900+Math.random()*400,.05*i,.1,'square',.04,300)}
function sndTick(){if(muted)return;tone(300,0,.06,'square',.04)}
function sndEnd(good){if(muted)return;(good?[392,523,659,784,1047]:[330,294,247,196,147]).forEach((f,i)=>tone(f,i*.18,.5,good?'triangle':'sawtooth',.15))}
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function answered(){return S.items.filter(x=>x.pick!==null).length}
function render(){S.done?renderResult():renderQ()}
function renderQ(){
 const q=Q[S.i],it=S.items[S.i],n=Q.length,ans=it.pick!==null;
 const dots=S.items.map((x,k)=>`<button class="dot ${x.pick===null?'':(x.o[x.pick].c?'ok':'bad')} ${k===S.i?'cur':''}" data-go="${k}" aria-label="Sual ${k+1}">${k+1}</button>`).join('');
 $('#app').innerHTML=`
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${answered()}"><i style="width:${answered()/n*100}%"></i></div>
 <div class="meta"><span>Cavablanan: ${answered()} / ${n}</span><span>Düzgün: ${S.items.filter(x=>x.pick!==null&&x.o[x.pick].c).length}</span></div>
 <section class="card">
  <div class="qn">Sual ${S.i+1} / ${n}</div>
  <h2 class="qt">${esc(q[0])}</h2>
  ${q[1]?`<img class="qimg" src="${IMGS[q[1]]}" alt="Sualın şəkli">`:''}
  <div class="opts">${it.o.map((o,k)=>{let cl='';if(ans){if(o.c)cl='ok';else if(k===it.pick)cl='bad'}return `<button class="opt ${cl}" data-pick="${k}" ${ans?'disabled':''}><b>${LET[k]}</b><span>${esc(o.t)}</span></button>`}).join('')}</div>
  <div class="hintrow">${it.hint?`<div class="hint"><small>💀 İpucu</small>${esc(q[4])}</div>`:`<button class="hintbtn" id="hint">💀 İpucu</button>`}</div>
  
  <div class="nav"><button class="btn alt" id="prev" ${S.i===0?'disabled':''}>← Geri</button>
   ${S.i===n-1?`<button class="btn" id="finish">Nəticəni göstər</button>`:`<button class="btn" id="next">İrəli →</button>`}</div>
  <div class="grid">${dots}</div>
 </section>`;
}
function renderResult(){
 const n=Q.length,ok=S.items.filter(x=>x.pick!==null&&x.o[x.pick].c).length;
 const wrong=S.items.map((x,k)=>({x,k})).filter(({x})=>x.pick!==null&&!x.o[x.pick].c);
 const skipped=S.items.map((x,k)=>({x,k})).filter(({x})=>x.pick===null);
 const pct=Math.round(ok/n*100);
 const rank=pct>=90?'Cadugər Ustası 🧙':pct>=70?'Qəbiristanlıq Gözətçisi 🦇':pct>=50?'Çıraq Daşıyan Pumpkin 🎃':'Hələ Ruhsan Qalmısan 👻';
 const row=({x,k})=>{const q=Q[k];const right=x.o.find(o=>o.c).t;return `<div class="err"><h3>${k+1}. ${esc(q[0])}</h3>${q[1]?`<img src="${IMGS[q[1]]}" alt="">`:''}<p class="y">${x.pick===null?'Cavab verilməyib':'Sənin cavabın: '+esc(x.o[x.pick].t)}</p><p class="c">Düzgün cavab: ${esc(right)}</p><p class="e">${esc(q[4])}</p></div>`};
 $('#app').innerHTML=`<section class="card">
  <div class="qn">Nəticə</div>
  <div class="score">${ok}/${n}</div><div class="rank">${rank}</div>
  <div class="stats"><span>Düzgün: <b>${ok}</b></span><span>Səhv: <b>${wrong.length}</b></span><span>Cavabsız: <b>${skipped.length}</b></span><span>Faiz: <b>${pct}%</b></span></div>
  <div class="nav" style="margin:0 0 14px"><button class="btn alt" id="back">← Suallara qayıt</button><button class="btn" id="again">Yenidən başla</button></div>
  ${wrong.length+skipped.length?`<div class="qn" style="margin-top:18px">Səhvlərin təhlili (${wrong.length+skipped.length})</div>${[...wrong,...skipped].sort((a,b)=>a.k-b.k).map(row).join('')}`:`<div class="perfect">Heç bir səhv yoxdur. Mükəmməl!</div>`}
 </section>`;
 sndEnd(pct>=50);window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;ctx();
 if(t.id==='mute'){muted=!muted;t.textContent=muted?'🔇 Səs: bağlı':'🔊 Səs: açıq';t.setAttribute('aria-pressed',muted);try{localStorage.setItem('hw-mute',muted?'1':'0')}catch(_){}return}
 if(t.dataset.pick!==undefined){const it=S.items[S.i];if(it.pick!==null)return;it.pick=+t.dataset.pick;it.o[it.pick].c?sndOk():sndBad();render();return}
 if(t.id==='hint'){S.items[S.i].hint=true;sndTick();render()}
 else if(t.id==='next'){S.i++;sndTick();render();window.scrollTo({top:0})}
 else if(t.id==='prev'){S.i--;sndTick();render();window.scrollTo({top:0})}
 else if(t.dataset.go!==undefined){S.i=+t.dataset.go;sndTick();render();window.scrollTo({top:0})}
 else if(t.id==='finish'){S.done=true;render()}
 else if(t.id==='back'){S.done=false;S.i=0;render()}
 else if(t.id==='again'){fresh();render();window.scrollTo({top:0})}
});
document.addEventListener('keydown',e=>{if(S.done)return;if(e.key==='ArrowRight'&&S.i<Q.length-1){S.i++;render()}else if(e.key==='ArrowLeft'&&S.i>0){S.i--;render()}});
$('#mute').textContent=muted?'🔇 Səs: bağlı':'🔊 Səs: açıq';
fresh();render();
</script>
