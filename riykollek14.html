<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fc;--card:#fff;--ink:#1d2433;--mut:#6b7488;--line:#e1e6f0;--pri:#3b6cf6;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdecec;--hint:#fff7df}
*{box-sizing:border-box}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.nav button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.nav button.cur{border-color:var(--pri);box-shadow:0 0 0 2px #3b6cf633}
.nav button.ok{background:var(--okbg);border-color:var(--ok)}.nav button.bad{background:var(--badbg);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px #1d24330d}
.qn{color:var(--mut);font-size:13px}.q{font-size:18px;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f2f6ff}
.opt:disabled{cursor:default}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.hb{margin-top:12px;border:1.5px dashed #e0b84a;background:var(--hint);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px}
.hb b{display:block}.hb span{display:none;margin-top:6px}.hb.open span{display:block}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.btn{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.score{font-size:42px;font-weight:700;text-align:center;color:var(--pri);margin:6px 0}
.err{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fff}
.err small{display:block;color:var(--mut)}.g{color:var(--ok)}.r{color:var(--bad)}
