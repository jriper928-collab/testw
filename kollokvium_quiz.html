<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompüter Şəbəkələri — III Kollokvium</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #ff80b0 0%, #ffb3cc 40%, #ffd6e7 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 16px 50px;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #6b0030;
    text-shadow: 0 1px 2px rgba(255,255,255,0.4);
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  .header h1 span {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #a0305a;
    margin-top: 3px;
    letter-spacing: 0;
  }

  .progress-wrap {
    background: rgba(255,255,255,0.35);
    border-radius: 20px;
    height: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .progress-bar {
    background: linear-gradient(90deg, #c0005a, #ff4488);
    height: 10px;
    border-radius: 20px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 13px;
    font-weight: 700;
    color: #7a0035;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 28px 26px 22px;
    box-shadow: 0 8px 32px rgba(180,0,80,0.13), 0 2px 8px rgba(180,0,80,0.08);
    margin-bottom: 16px;
  }

  .q-num {
    font-size: 12px;
    font-weight: 700;
    color: #d04070;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 16px;
    font-weight: 800;
    color: #1a0010;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt {
    padding: 13px 18px;
    border-radius: 12px;
    border: 2.5px solid #f0a0c0;
    background: #fff0f6;
    color: #3a0020;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    line-height: 1.45;
    font-family: 'Nunito', sans-serif;
  }

  .opt:hover:not([disabled]) {
    background: #ffe0ee;
    border-color: #d6006e;
    transform: translateX(3px);
  }

  .opt:active:not([disabled]) {
    transform: scale(0.98);
  }

  .opt.correct {
    background: #d0f5e5 !important;
    border-color: #14a058 !important;
    color: #073d20 !important;
  }

  .opt.wrong {
    background: #ffd8d8 !important;
    border-color: #d63030 !important;
    color: #3d0a0a !important;
  }

  .opt[disabled] { cursor: default; }

  .feedback {
    margin-top: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    display: none;
    line-height: 1.5;
  }

  .feedback.ok {
    display: block;
    background: #d0f5e5;
    color: #073d20;
    border: 2px solid #14a058;
  }

  .feedback.fail {
    display: block;
    background: #ffd8d8;
    color: #3d0a0a;
    border: 2px solid #d63030;
  }

  .hint-btn {
    margin-top: 14px;
    background: transparent;
    border: 2px dashed #f0a0c0;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #c0507a;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s;
  }

  .hint-btn:hover { background: #ffe4f0; }

  .hint-box {
    margin-top: 10px;
    background: #fff0f6;
    border: 2px solid #f0a0c0;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #7a0035;
    display: none;
  }

  .hint-box.show { display: block; }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #ffffff;
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow: 0 4px 16px rgba(180,0,80,0.10);
  }

  .nav-btn {
    padding: 10px 24px;
    border-radius: 10px;
    border: 2.5px solid #d6006e;
    background: #ffffff;
    color: #d6006e;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s, transform 0.1s;
  }

  .nav-btn:hover:not([disabled]) { background: #ffe0ee; }
  .nav-btn:active:not([disabled]) { transform: scale(0.97); }
  .nav-btn[disabled] { opacity: 0.3; cursor: default; }

  .nav-btn.next {
    background: linear-gradient(135deg, #d6006e, #ff4488);
    color: #ffffff;
    border-color: transparent;
  }

  .nav-btn.next:hover:not([disabled]) { background: linear-gradient(135deg, #b00058, #e0306a); }

  .q-counter {
    font-size: 14px;
    font-weight: 800;
    color: #a0305a;
  }

  /* Result screen */
  .result {
    text-align: center;
    padding: 32px 20px;
  }

  .result h2 {
    font-size: 26px;
    font-weight: 800;
    color: #7a0035;
    margin-bottom: 6px;
  }

  .score-big {
    font-size: 64px;
    font-weight: 800;
    color: #d6006e;
    line-height: 1;
    margin: 16px 0 6px;
  }

  .score-lbl {
    font-size: 15px;
    font-weight: 700;
    color: #c0507a;
    margin-bottom: 28px;
  }

  .wrong-list { text-align: left; margin-top: 10px; }

  .wrong-list h3 {
    font-size: 15px;
    font-weight: 800;
    color: #7a0035;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2.5px solid #f0a0c0;
  }

  .wrong-item {
    background: #ffffff;
    border: 2px solid #f0a0c0;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .wi-q { font-size: 13px; font-weight: 800; color: #1a0010; margin-bottom: 6px; line-height: 1.4; }
  .wi-wrong { font-size: 12px; font-weight: 700; color: #c03030; margin-bottom: 4px; }
  .wi-correct { font-size: 12px; font-weight: 700; color: #14a058; }

  .all-correct {
    font-size: 16px;
    font-weight: 800;
    color: #14a058;
    background: #d0f5e5;
    border: 2px solid #14a058;
    border-radius: 12px;
    padding: 16px;
    margin-top: 10px;
  }

  .restart-btn {
    margin-top: 28px;
    padding: 14px 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #d6006e, #ff4488);
    color: #ffffff;
    border: none;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(180,0,80,0.25);
  }

  .restart-btn:hover { background: linear-gradient(135deg, #b00058, #e0306a); transform: translateY(-1px); }

let cur = 0, score = 0;
let answered = [], wrongList = [];

function shuffle(a) {
  let b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function init() {
  cur = 0; score = 0; wrongList = [];
  answered = QA.map(q => ({
    q: q[0],
    correct: q[1],
    opts: shuffle([q[1], q[2], q[3], q[4]]),
    chosen: null
  }));
  render();
}

function playSound(ok) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ok) {
      [[523, 0], [659, 0.12], [784, 0.24]].forEach(([f, t]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.22, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.28);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.28);
      });
    } else {
      [[300, 0], [220, 0.2]].forEach(([f, t]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f; o.type = 'sawtooth';
        g.gain.setValueAtTime(0.18, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
      });
    }
  } catch (e) {}
}

function render() {
  const total = QA.length;
  const pct = Math.round((cur / total) * 100);
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('sdone').textContent = (cur + 1) + ' / ' + total + ' sual';
  document.getElementById('sscore').textContent = 'Doğru: ' + score;

  const d = answered[cur];
  const isAns = d.chosen !== null;

  const labels = ['A', 'B', 'C', 'D'];
  const optsHTML = d.opts.map((o, i) => {
    let cls = 'opt';
    if (isAns) {
      if (o === d.correct) cls += ' correct';
      else if (o === d.chosen && o !== d.correct) cls += ' wrong';
    }
    return `<button class="${cls}" ${isAns ? 'disabled' : ''} onclick="choose(${i})">
      <strong>${labels[i]})</strong> ${o}
    </button>`;
  }).join('');

  let fbHTML = '';
  if (isAns) {
    if (d.chosen === d.correct) {
      fbHTML = `<div class="feedback ok">✓ Doğru cavab!</div>`;
    } else {
      fbHTML = `<div class="feedback fail">✗ Səhv! Doğru cavab: ${d.correct}</div>`;
    }
  }

  const isLast = cur === total - 1;
  const nextDisabled = !isAns ? 'disabled' : '';

  document.getElementById('qa').innerHTML = `
    <div class="card">
      <div class="q-num">Sual ${cur + 1} / ${total}</div>
      <div class="q-text">${d.q}</div>
      <div class="options">${optsHTML}</div>
      ${fbHTML}
      <button class="hint-btn" onclick="this.nextElementSibling.classList.toggle('show')">
        Ipucu göstər
      </button>
      <div class="hint-box ${isAns ? 'show' : ''}">Doğru cavab: ${d.correct}</div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="go(-1)" ${cur === 0 ? 'disabled' : ''}>← Geri</button>
      <span class="q-counter">${cur + 1} / ${total}</span>
      <button class="nav-btn next" onclick="go(1)" ${nextDisabled}>${isLast ? 'Nəticə →' : 'Növbəti →'}</button>
    </div>
  `;
}

function choose(i) {
  const d = answered[cur];
  if (d.chosen !== null) return;
  const sel = d.opts[i];
  d.chosen = sel;
  const ok = sel === d.correct;
  if (ok) score++;
  else wrongList.push({ q: d.q, wrong: sel, correct: d.correct });
  playSound(ok);
  render();
}

function go(dir) {
  const next = cur + dir;
  if (next < 0) return;
  if (next >= QA.length) { showResult(); return; }
  cur = next;
  render();
}

function showResult() {
  document.getElementById('pb').style.width = '100%';
  document.getElementById('sdone').textContent = 'Tamamlandı!';
  document.getElementById('sscore').textContent = 'Doğru: ' + score;
  const total = QA.length;
  const pct = Math.round((score / total) * 100);
  const msg = pct >= 80 ? 'Əla nəticə! Bravo!' : pct >= 60 ? 'Yaxşı nəticə!' : 'Daha çox çalışın!';

  let wrongHTML = '';
  if (wrongList.length > 0) {
    wrongHTML = `<div class="wrong-list">
      <h3>Səhv cavablandırılan suallar (${wrongList.length} ədəd):</h3>
      ${wrongList.map(w => `<div class="wrong-item">
        <div class="wi-q">${w.q}</div>
        <div class="wi-wrong">✗ Sizin cavabınız: ${w.wrong}</div>
        <div class="wi-correct">✓ Doğru cavab: ${w.correct}</div>
      </div>`).join('')}
    </div>`;
  } else {
    wrongHTML = `<div class="all-correct">Möhtəşəm! Bütün 60 sualı doğru cavablandırdınız!</div>`;
  }

  document.getElementById('qa').innerHTML = `
    <div class="card">
      <div class="result">
        <h2>${msg}</h2>
        <div class="score-big">${score}/${total}</div>
        <div class="score-lbl">Nəticəniz: ${pct}%</div>
        ${wrongHTML}
        <button class="restart-btn" onclick="init()">Yenidən başla</button>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
