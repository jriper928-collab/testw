function start(list){T=(list||D).map(d=>({q:d[0],a:d[1],o:sh([d[1],...d[2]]),pick:null,hint:false}));cur=0;fin=false;draw()}
function draw(){
 if(fin)return result();const t=T[cur],done=T.filter(x=>x.pick!==null).length;
 $("#app").innerHTML=`<div class="bar"><i style="width:${done/T.length*100}%"></i></div>
 <div class="card"><div class="meta">Sual ${cur+1} / ${T.length} · cavablanıb: ${done}</div><p class="q">${t.q}</p>
 <div id="os">${t.o.map((o,i)=>{let c="";if(t.pick!==null){if(o===t.a)c="ok";else if(i===t.pick)c="no"}else if(t.hint&&o===t.a)c="hint";
 return `<button class="opt ${c}" ${t.pick!==null?"disabled":""} data-i="${i}"><b>${"ABCD"[i]}</b><span>${disp(o)}</span></button>`}).join("")}</div>
 <div class="row" style="margin-top:10px"><button class="b h" id="hb" ${t.pick!==null||t.hint?"disabled":""}>💡 İpucu</button>${t.hint&&t.pick===null?'<div class="hbox">💡 Cavab: <b>'+disp(t.a)+'</b></div>':""}</div></div>
 <div class="row"><button class="b g" id="pv" ${cur?"":"disabled"}>← Əvvəlki</button><button class="b g" id="nx" ${cur<T.length-1?"":"disabled"}>Növbəti →</button><span class="sp"></span><button class="b r" id="fn">Testi bitir</button></div>
 <div id="fw"></div><div class="card"><div class="meta">Suallar</div><div class="grid">${T.map((x,i)=>`<button data-g="${i}" class="${i===cur?"cur ":""}${x.pick===null?"":x.o[x.pick]===x.a?"ok":"no"}">${i+1}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;t.pick=i;snd(t.o[i]===t.a);draw()});
 $("#hb").onclick=()=>{t.hint=true;draw()};$("#pv").onclick=()=>{cur--;draw()};$("#nx").onclick=()=>{cur++;draw()};
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{cur=+b.dataset.g;draw()});
 $("#fn").onclick=()=>{const left=T.length-done;if(!left)return finish();
  $("#fw").innerHTML=`<div class="fin">Hələ <b>${left}</b> sual cavablanmayıb. Yenə də bitirmək istəyirsiniz?<div class="row" style="margin-top:8px"><button class="b r" id="y">Bəli, bitir</button><button class="b g" id="n">Davam et</button></div></div>`;
  $("#y").onclick=finish;$("#n").onclick=()=>$("#fw").innerHTML=""}}
function finish(){fin=true;draw()}
function result(){
 const ok=T.filter(x=>x.pick!==null&&x.o[x.pick]===x.a).length,bad=T.filter(x=>x.pick!==null&&x.o[x.pick]!==x.a),sk=T.filter(x=>x.pick===null),hs=T.filter(x=>x.hint).length,p=Math.round(ok/T.length*100);
 $("#app").innerHTML=`<div class="card"><div class="meta">Nəticə</div><div class="big">${p}%</div><div class="stats"><span>✅ Düzgün: ${ok}</span><span>❌ Səhv: ${bad.length}</span><span>⏭ Cavabsız: ${sk.length}</span><span>💡 İpucu: ${hs}</span></div>
 <div class="row"><button class="b" id="rs">Yenidən başla</button>${bad.length+sk.length?'<button class="b g" id="rt">Yalnız səhvləri təkrarla</button>':""}</div></div>
 ${bad.length?`<h3>Səhvləriniz</h3>`+bad.map(x=>`<div class="err"><p><b>${x.q}</b></p><p class="y">Sizin cavab: ${disp(x.o[x.pick])}</p><p class="g2">Düzgün cavab: ${disp(x.a)}</p></div>`).join(""):'<div class="card">🎉 Səhviniz yoxdur!</div>'}
 ${sk.length?`<h3>Cavablanmayan suallar</h3>`+sk.map(x=>`<div class="err"><p><b>${x.q}</b></p><p class="g2">Düzgün cavab: ${disp(x.a)}</p></div>`).join(""):""}`;
 $("#rs").onclick=()=>start();const r=$("#rt");if(r)r.onclick=()=>{const w=new Set([...bad,...sk].map(x=>x.q));start(D.filter(d=>w.has(d[0])))};scrollTo(0,0)}
start();
</script></body></html>
