let cur=0,ans=Array(N).fill(-1),hint=Array(N).fill(false),mute=false,done=false,ctx;
const $=document.getElementById("app");
function snd(ok){if(mute)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;(ok?[660,990]:[220,150]).forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?"sine":"sawtooth";o.frequency.value=f;const s=t+i*.15;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+.27)})}catch(e){}}
function pick(i){if(ans[cur]>=0)return;ans[cur]=i;snd(i===Q[cur].c);render()}
function go(n){cur=Math.max(0,Math.min(N-1,n));done=false;render()}
function right(){return ans.filter((a,i)=>a===Q[i].c).length}
function render(){
if(done)return result();
const q=Q[cur],a=ans[cur],ak=a>=0,answered=ans.filter(x=>x>=0).length;
let h=`<div class="card"><div class="top"><h1>II kollokvium — Test</h1><div><span style="color:var(--m)">Düzgün: <b>${right()}</b> · Cavablanan: <b>${answered}/${N}</b></span> <button class="b g" onclick="mute=!mute;render()" title="Səs">${mute?"🔇":"🔊"}</button></div></div><div class="bar"><i style="width:${answered/N*100}%"></i></div></div>`;
h+=`<div class="card"><div style="color:var(--m);font-size:14px">Sual ${cur+1} / ${N}</div><div class="q">${q.q}</div>`;
if(hint[cur])h+=`<div class="hint">💡 <b>İpucu — cavab:</b> ${q.o[q.c]}${q.e?`<div class="ex">${q.e}</div>`:""}</div>`;
q.o.forEach((t,i)=>{let c="";if(ak){if(i===q.c)c="ok";else if(i===a)c="no"}h+=`<button class="o ${c}" ${ak?"disabled":""} onclick="pick(${i})"><b>${L[i]}</b><span>${t}</span></button>`});
if(ak)h+=`<div class="ex">${a===q.c?"✅ Düzgündür!":"❌ Səhvdir. Düzgün cavab: <b>"+L[q.c]+"</b>"}${q.e?" — "+q.e:""}</div>`;
h+=`<div class="row" style="margin-top:14px"><button class="b g" ${hint[cur]?"disabled":""} onclick="hint[cur]=true;render()">💡 İpucu</button><div style="display:flex;gap:10px"><button class="b g" ${cur==0?"disabled":""} onclick="go(cur-1)">← Əvvəlki</button><button class="b" ${cur==N-1?"disabled":""} onclick="go(cur+1)">Sonrakı →</button></div></div></div>`;
h+=`<div class="card"><div class="grid">${Q.map((x,i)=>`<button class="${ans[i]<0?"":ans[i]===x.c?"ok":"no"} ${i==cur?"cur":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div><div class="row" style="margin-top:14px"><span style="color:var(--m)">Sualları nömrəyə basaraq da dəyişə bilərsiniz.</span><button class="b" onclick="done=true;render()">Nəticəni göstər</button></div></div>`;
$.innerHTML=h}
function result(){
const r=right(),w=[],u=[];Q.forEach((q,i)=>{if(ans[i]<0)u.push(i+1);else if(ans[i]!==q.c)w.push(i)});
const p=Math.round(r/N*100),hc=hint.filter(Boolean).length;
let h=`<div class="card" style="text-align:center"><h1>Nəticə</h1><div class="big">${r} / ${N}</div><div>${p}% düzgün</div><div style="color:var(--m);margin-top:6px">Səhv: <b style="color:var(--no)">${w.length}</b> · Cavablanmayan: <b>${u.length}</b> · İpucu istifadəsi: <b>${hc}</b></div><div class="row" style="justify-content:center;margin-top:14px"><button class="b g" onclick="done=false;render()">← Testə qayıt</button><button class="b" onclick="ans=Array(N).fill(-1);hint=Array(N).fill(false);cur=0;done=false;render()">Yenidən başla</button></div></div>`;
h+=`<div class="card"><h1 style="font-size:18px">Səhvlər (${w.length})</h1>`;
if(!w.length)h+=`<p>🎉 Cavablanan suallarda səhv yoxdur!</p>`;
w.forEach(i=>{const q=Q[i];h+=`<div class="err"><b>${i+1}. ${q.q}</b><small>Sizin cavab: <span style="color:var(--no)">${q.o[ans[i]]}</span></small><small>Düzgün cavab: <span style="color:var(--ok)"><b>${q.o[q.c]}</b></span></small>${q.e?`<small>${q.e}</small>`:""}<button class="b g" style="margin-top:8px;padding:4px 10px" onclick="go(${i})">Suala get</button></div>`});
if(u.length)h+=`<p style="color:var(--m)">Cavablanmayan suallar: ${u.join(", ")}</p>`;
$.innerHTML=h+"</div>";window.scrollTo(0,0)}
render();
</script>
</body>
</html>
